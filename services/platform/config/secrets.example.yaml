# Holocron consolidated secrets schema (committed example — NOT real values).
# Copy to secrets.yaml (gitignored) and fill in host-specific values.
#
# Portability contract (AC-1 / TC-5):
#   - Same keys on mini and laptop
#   - Values differ (e.g. DATABASE_URL host / user)
#   - Resolve order: process env > secrets.yaml > (required keys fail closed)
#
# Required keys are validated by `holo secrets doctor`.

# Postgres (see docs/postgres-provisioning.md)
# laptop loopback example:  postgres://USER@127.0.0.1:5432/holocron
# mini tailnet example:     postgres://postgres@100.x.y.z:5432/holocron
DATABASE_URL: postgres://127.0.0.1:5432/holocron

# Mastra / platform API
MASTRA_API_KEY: replace-me-mastra-api-key

# Tailscale auth (optional on pure loopback dev; required for fleet join)
TAILSCALE_AUTH_KEY: replace-me-tailscale-auth-key

# Fleet inference endpoint (Role Manifest :4545)
FLEET_URL: http://127.0.0.1:4545/v1
FLEET_KEY: sk-none

# Platform HTTP service
HOLO_PORT: "4111"
# Public/base URL for app + MCP (replaces former cloud URL aliases)
PLATFORM_URL: http://127.0.0.1:4111
PLATFORM_SITE_URL: http://127.0.0.1:4111

# Scoped API keys (RN app / MCP / control plane) — see scoped-key middleware
HOLO_KEY_RN: replace-me-rn-key
HOLO_KEY_MCP: replace-me-mcp-key
HOLO_KEY_CONTROL: replace-me-control-key

# Zero sync service. Keep the real value in ignored secrets.yaml; launchd and
# Compose resolve it at runtime without placing it in a plist or process argv.
ZERO_ADMIN_PASSWORD: replace-me-zero-admin-password

# ---------------------------------------------------------------------------
# Cutover soak fence / data-plane (Sprint 29 D06-05 / REDHAT-FIX-S29-C02 / S31-OPS-06)
# Written by `holo cutover:flip` and `holo cutover:rollback-repoint`.
# Serving processes re-read HOLO_MIGRATION_READ_ONLY from this file on every
# write chokepoint when process.env is unset (durable distributed fence).
# Values below are placeholders only — never commit real secrets.yaml.
#
# Freeze keys (one-way cutover freeze — 01-scope: no thaw / no product thaw):
#   HOLO_MIGRATION_READ_ONLY       — platform soak write fence ("1"|"true" armed)
#   HOLO_CUTOVER_SCHEDULES_DISABLED — drain sequencing flag (complementary; not a second fence)
#
# Source of truth split (S31-OPS-06):
#   - Platform post-PONR writes: this secrets.yaml control-plane (durable re-read).
#   - cutover write fence: deployment env HOLO_MIGRATION_READ_ONLY (armed by
#     `holo cutover:freeze`). source deployment remains fenced through soak; there is no
#     cutover:thaw command and operators must not unset HOLO_MIGRATION_READ_ONLY on the retired deployment
#     as a product path (incident process only).
#   - Reconcile with: `holo cutover:fence-status --json` (fails closed on FENCE_SPLIT_BRAIN).
# ---------------------------------------------------------------------------
# HOLO_MIGRATION_READ_ONLY: "0"
# HOLO_CUTOVER_SCHEDULES_DISABLED: "0"
# HOLO_DATA_PLANE: postgres
# HOLO_ROLLBACK_TARGET: frozen:retired-source
# HOLO_ROLLBACK_ENGAGED_AT: ""
#
# REDHAT-FIX-RH-S30-04 — operator secret for authorized cutover mutations under
# an armed HOLO_MIGRATION_READ_ONLY fence (seedInFlightForDrainTest, disableAndDrain,
# recordWriteAttempt). Must ALSO be set on the retired source deployment if still present:
#   export HOLO_CUTOVER_OPERATOR_SECRET '<same-value>'
# Platform quiet-check/freeze pass operatorSecret from this env/secret.
# HOLO_CUTOVER_OPERATOR_SECRET: replace-me-cutover-operator-secret-min-8-chars

# ---------------------------------------------------------------------------
# Off-mini backup / CAP-BAK-01 (D04-02) — populated by `holo backup:provision`
# Runtime keys are bucket-scoped and DISTINCT from DATABASE_URL / Fleet.
# NEVER commit real values. R2_CREDENTIAL_POLICY is IAM-style JSON (no *).
# ---------------------------------------------------------------------------
# R2_ACCOUNT_ID: replace-me-cloudflare-account-id
# R2_ENDPOINT: https://<accountid>.r2.cloudflarestorage.com
# R2_BUCKET_NAME: holocron-backup
# R2_ACCESS_KEY_ID: replace-me-scoped-access-key
# R2_SECRET_ACCESS_KEY: replace-me-scoped-secret
# R2_SESSION_TOKEN: optional-session-token-for-temp-creds
# R2_CREDENTIAL_POLICY: '{"Version":"2012-10-17","Statement":[...]}'
# R2_REPO_CIPHER_PASS: replace-me-pgbackrest-repo-cipher-pass
# R2_PGBACKREST_PREFIX: pgbackrest
# PGBACKREST_CONFIG: services/platform/config/pgbackrest/pgbackrest.conf
# PGBACKREST_STANZA: main
# PGBACKREST_PG1_PATH: /opt/homebrew/var/postgresql@18
#
# Restic blob mirror (D04-04) — separate encrypted prefix from pgBackRest.
# RESTIC_PASSWORD is generated by `holo backup:mirror` if missing; NEVER store it
# inside the R2 restic object prefix (password lives only in secrets/env).
# RESTIC_PASSWORD: replace-me-restic-repo-password-min-16-chars
# R2_RESTIC_PREFIX: restic
#
# Backup failure/overdue alerting (D04-05) — webhook sink for alert sweep.
# ALERT_WEBHOOK_URL is POSTed by `holo backup:alert-sweep` / launchd schedule.
# Never embed this URL in LaunchAgent plists (env > secrets.yaml only).
# ALERT_WEBHOOK_URL: https://hooks.example.invalid/alert
#
# Admin-only (provision bootstrap; do NOT store multi-bucket parent keys as runtime):
# CLOUDFLARE_API_TOKEN: replace-me-cf-api-token-with-r2-write
# R2_PARENT_ACCESS_KEY_ID: replace-me-parent-access-key
# R2_PARENT_SECRET_ACCESS_KEY: replace-me-parent-secret
#
# Restore-target object-read-only (D05-03 AC-2) — DISTINCT from R2_ACCESS_KEY_ID above.
# List/Get only; prove with: REQUIRE_LIVE_R2_RO=1 ./scripts/prove-r2-readonly.sh
# R2_RESTORE_ACCESS_KEY_ID: replace-me-restore-object-read-only-key
# R2_RESTORE_SECRET_ACCESS_KEY: replace-me-restore-object-read-only-secret
# R2_RESTORE_SESSION_TOKEN: optional-temp-session-token

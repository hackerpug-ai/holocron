# Holocron consolidated secrets schema (committed example — NOT real values).
# Copy to secrets.yaml (gitignored) and fill in host-specific values.
#
# Portability contract (AC-1 / TC-5):
#   - Same keys on mini and laptop
#   - Values differ (e.g. DATABASE_URL host / user)
#   - Resolve order: process env > secrets.yaml > (required keys fail closed)
#
# Required keys are validated by `holo secrets doctor`.

# Postgres (see docs/postgres-provisioning.md)
# laptop loopback example:  postgres://USER@127.0.0.1:5432/holocron
# mini tailnet example:     postgres://postgres@100.x.y.z:5432/holocron
DATABASE_URL: postgres://127.0.0.1:5432/holocron

# Mastra / platform API
MASTRA_API_KEY: replace-me-mastra-api-key

# Tailscale auth (optional on pure loopback dev; required for fleet join)
TAILSCALE_AUTH_KEY: replace-me-tailscale-auth-key

# Fleet inference endpoint (Role Manifest :4545)
FLEET_URL: http://127.0.0.1:4545/v1
FLEET_KEY: sk-none

# Platform HTTP service
HOLO_PORT: "4111"
# Public/base URL for app + MCP (replaces former Convex URL aliases)
PLATFORM_URL: http://127.0.0.1:4111
PLATFORM_SITE_URL: http://127.0.0.1:4111

# Scoped API keys (RN app / MCP / control plane) — see scoped-key middleware
HOLO_KEY_RN: replace-me-rn-key
HOLO_KEY_MCP: replace-me-mcp-key
HOLO_KEY_CONTROL: replace-me-control-key

# ---------------------------------------------------------------------------
# Off-mini backup / CAP-BAK-01 (D04-02) — populated by `holo backup:provision`
# Runtime keys are bucket-scoped and DISTINCT from DATABASE_URL / Fleet.
# NEVER commit real values. R2_CREDENTIAL_POLICY is IAM-style JSON (no *).
# ---------------------------------------------------------------------------
# R2_ACCOUNT_ID: replace-me-cloudflare-account-id
# R2_ENDPOINT: https://<accountid>.r2.cloudflarestorage.com
# R2_BUCKET_NAME: holocron-backup
# R2_ACCESS_KEY_ID: replace-me-scoped-access-key
# R2_SECRET_ACCESS_KEY: replace-me-scoped-secret
# R2_SESSION_TOKEN: optional-session-token-for-temp-creds
# R2_CREDENTIAL_POLICY: '{"Version":"2012-10-17","Statement":[...]}'
# R2_REPO_CIPHER_PASS: replace-me-pgbackrest-repo-cipher-pass
# R2_PGBACKREST_PREFIX: pgbackrest
# PGBACKREST_CONFIG: services/platform/config/pgbackrest/pgbackrest.conf
# PGBACKREST_STANZA: main
# PGBACKREST_PG1_PATH: /opt/homebrew/var/postgresql@18
#
# Admin-only (provision bootstrap; do NOT store multi-bucket parent keys as runtime):
# CLOUDFLARE_API_TOKEN: replace-me-cf-api-token-with-r2-write
# R2_PARENT_ACCESS_KEY_ID: replace-me-parent-access-key
# R2_PARENT_SECRET_ACCESS_KEY: replace-me-parent-secret


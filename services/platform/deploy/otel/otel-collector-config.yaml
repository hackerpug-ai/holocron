receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 32
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

exporters:
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:LANGFUSE_AUTH_HEADER}
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 20s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000
      storage: file_storage

extensions:
  file_storage:
    directory: /var/lib/otelcol/queue
    # NOTE: this collector build rejects a `ttl` key under file_storage
    # ("invalid keys: ttl" → crash loop). Queue lifetime is instead bounded
    # by sending_queue.queue_size (1000 spans) above, which caps on-disk
    # growth during a prolonged Langfuse outage.
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [file_storage, health_check, zpages]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      # OBS remediation A5: production ships spans to Langfuse only; the debug
      # exporter stays available in the canary stack (deploy/otel) for
      # laptop-level troubleshooting.
      exporters: [otlphttp/langfuse]

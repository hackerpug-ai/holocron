# Holocron production container contract v2 (OBS-04).
# Exact OBS-01 Candidate A topology: 12 services + 8 durable volumes.
# Application images are digest-qualified; secrets use ${NAME:?} / file mounts.
name: holocron

x-holocron-contract: &contract
  io.holocron.compose-contract: "v2"

x-holocron-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-langfuse-env: &langfuse-env
  # Next.js standalone server binds to $HOSTNAME (Docker sets this to the
  # container's short ID, which is not a loopback address) unless told
  # otherwise, which makes 127.0.0.1-based healthchecks fail with connection
  # refused even though the app is up. Bind all interfaces instead.
  HOSTNAME: "0.0.0.0"
  DATABASE_URL: ${LANGFUSE_DATABASE_URL:?LANGFUSE_DATABASE_URL is required}
  NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:?LANGFUSE_NEXTAUTH_URL is required}
  NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?LANGFUSE_NEXTAUTH_SECRET is required}
  SALT: ${LANGFUSE_SALT:?LANGFUSE_SALT is required}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?LANGFUSE_ENCRYPTION_KEY is required}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: ${LANGFUSE_CLICKHOUSE_MIGRATION_URL:?LANGFUSE_CLICKHOUSE_MIGRATION_URL is required}
  CLICKHOUSE_URL: ${LANGFUSE_CLICKHOUSE_URL:?LANGFUSE_CLICKHOUSE_URL is required}
  CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:?LANGFUSE_CLICKHOUSE_USER is required}
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?LANGFUSE_CLICKHOUSE_PASSWORD is required}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_USE_AZURE_BLOB: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:?LANGFUSE_S3_BUCKET is required}
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:?LANGFUSE_S3_ACCESS_KEY_ID is required}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:?LANGFUSE_S3_SECRET_ACCESS_KEY is required}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_ENDPOINT:?LANGFUSE_S3_ENDPOINT is required}
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:?LANGFUSE_S3_BUCKET is required}
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:?LANGFUSE_S3_ACCESS_KEY_ID is required}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:?LANGFUSE_S3_SECRET_ACCESS_KEY is required}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_ENDPOINT:?LANGFUSE_S3_ENDPOINT is required}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:?LANGFUSE_REDIS_AUTH is required}

services:
  postgres:
    # Pinned from the Docker Hub pgvector/pgvector:pg18 OCI index (PostgreSQL
    # 18.4, whose built-in uuidv7() is required by the platform schema).
    image: pgvector/pgvector@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
    restart: unless-stopped
    mem_limit: ${HOLO_POSTGRES_MEM_LIMIT:-8g}
    logging: *bounded-logging
    labels: *contract
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - source: postgres-password
        target: postgres_password
    volumes:
      # PG18's official image declares /var/lib/postgresql as its volume root.
      - postgres-data:/var/lib/postgresql
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mastra:
    image: ${HOLO_PLATFORM_IMAGE:?HOLO_PLATFORM_IMAGE must use @sha256:<64-hex>}
    restart: unless-stopped
    mem_limit: ${HOLO_MASTRA_MEM_LIMIT:-6g}
    logging: *bounded-logging
    labels:
      <<: *contract
      io.holocron.backup.pgbackrest-image: "woblerr/pgbackrest@sha256:3e6c90cc4287efad0c16d667992aee9c70226bcb6ef3052f69a0c84121454bce"
      io.holocron.backup.restic-image: "restic/restic@sha256:740ef3a20c7fe5de05ee031717a610ac8c3d1cf09a06cf77ffd4c3ec26e2302e"
      io.holocron.backup.pgbackrest-conf: "/etc/pgbackrest/pgbackrest.conf"
      io.holocron.backup.pgbackrest-bin: "/usr/local/bin/pgbackrest"
      io.holocron.backup.restic-bin: "/usr/local/bin/restic"
    environment:
      PORT: "4111"
      FLEET_URL: ${FLEET_URL:?FLEET_URL is required}
      HOLO_BLOB_ROOT: /var/lib/holocron/blobs
      PGBACKREST_CONFIG: /etc/pgbackrest/pgbackrest.conf
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      JINA_API_KEY: ${JINA_API_KEY}
      EXA_API_KEY: ${EXA_API_KEY}
      HOME: /home/bun
      XDG_CONFIG_HOME: /home/bun/.config
      OPENCODE_CONFIG: /home/bun/.config/opencode/opencode.json
      SCRATCH_ROOT: /var/lib/holocron/assimilate
    command:
      - /bin/sh
      - -ec
      - >-
        export DATABASE_URL="$$(cat /run/secrets/database_url)";
        export MASTRA_API_KEY="$$(cat /run/secrets/mastra_api_key)";
        export FLEET_KEY="$$(cat /run/secrets/fleet_key)";
        export PGPASSWORD="$$(bun -e 'const u = new URL(process.env.DATABASE_URL); process.stdout.write(decodeURIComponent(u.password))')";
        export DATABASE_URL="$$(bun -e 'const u = new URL(process.env.DATABASE_URL); u.password = ""; process.stdout.write(u.toString())')";
        bun src/cli/holo.ts db:migrate;
        exec bun src/index.ts
    secrets:
      - source: database-url
        target: database_url
      - source: mastra-api-key
        target: mastra_api_key
      - source: fleet-key
        target: fleet_key
    volumes:
      # Blob store is bind-mounted (not one of the eight declared state volumes).
      - ${HOLO_BLOB_HOST_PATH:-./.data/holocron-blobs}:/var/lib/holocron/blobs
      - ${HOLO_ASSIMILATE_SCRATCH:-./.data/holocron-assimilate}:/var/lib/holocron/assimilate
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:4111/health');if(!r.ok)process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  scheduler:
    image: ${HOLO_PLATFORM_IMAGE:?HOLO_PLATFORM_IMAGE must use @sha256:<64-hex>}
    restart: unless-stopped
    mem_limit: ${HOLO_SCHEDULER_MEM_LIMIT:-2g}
    logging: *bounded-logging
    labels:
      <<: *contract
      io.holocron.backup.pgbackrest-image: "woblerr/pgbackrest@sha256:3e6c90cc4287efad0c16d667992aee9c70226bcb6ef3052f69a0c84121454bce"
      io.holocron.backup.restic-image: "restic/restic@sha256:740ef3a20c7fe5de05ee031717a610ac8c3d1cf09a06cf77ffd4c3ec26e2302e"
      io.holocron.backup.pgbackrest-conf: "/etc/pgbackrest/pgbackrest.conf"
      io.holocron.backup.pgbackrest-bin: "/usr/local/bin/pgbackrest"
      io.holocron.backup.restic-bin: "/usr/local/bin/restic"
    environment:
      FLEET_URL: ${FLEET_URL:?FLEET_URL is required}
      PGBACKREST_CONFIG: /etc/pgbackrest/pgbackrest.conf
    command:
      - /bin/sh
      - -ec
      - >-
        export DATABASE_URL="$$(cat /run/secrets/database_url)";
        export FLEET_KEY="$$(cat /run/secrets/fleet_key)";
        exec bun src/queue/scheduler-worker.ts
    secrets:
      - source: database-url
        target: database_url
      - source: fleet-key
        target: fleet_key
    volumes:
      - ${HOLO_BLOB_HOST_PATH:-./.data/holocron-blobs}:/var/lib/holocron/blobs
      - ./pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      mastra:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "export DATABASE_URL=\"$$(cat /run/secrets/database_url)\"; exec bun src/queue/probe-cli.ts"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 15s

  zero-cache:
    # Pinned from the GHCR rociCorp/zero:1.8.0 OCI index.
    image: ghcr.io/rocicorp/zero@sha256:9be2d9303b076f2aef29cbcc629350dbc40cf0531ead59a7f61572eeb65fef72
    restart: unless-stopped
    mem_limit: ${HOLO_ZERO_CACHE_MEM_LIMIT:-3g}
    logging: *bounded-logging
    labels: *contract
    environment:
      ZERO_PORT: "4848"
      ZERO_PUBLICATION: zero_pub
      ZERO_NUM_SYNC_WORKERS: "4"
      ZERO_UPSTREAM_MAX_CONNS: "8"
      ZERO_CVR_MAX_CONNS: "8"
      ZERO_ENABLE_CRUD_MUTATIONS: "false"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export ZERO_UPSTREAM_DB="$$(cat /run/secrets/database_url)";
        export ZERO_CVR_DB="$$ZERO_UPSTREAM_DB";
        export ZERO_CHANGE_DB="$$ZERO_UPSTREAM_DB";
        export ZERO_ADMIN_PASSWORD="$$(cat /run/secrets/zero_admin_password)";
        exec zero-cache --app-publications "$$ZERO_PUBLICATION" --port "$$ZERO_PORT" --num-sync-workers "$$ZERO_NUM_SYNC_WORKERS"
    secrets:
      - source: database-url
        target: database_url
      - source: zero-admin-password
        target: zero_admin_password
    volumes:
      - zero-cache-data:/var/lib/zero
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      mastra:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:4848/keepalive"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  edge:
    # OBS-01 Candidate A edge pin. OBS-05 owns /observability custom web routing.
    image: docker.io/library/caddy@sha256:dc5640f3339bba2a36cb20392dd32d432bd88d14275cdf1f3637f3107caf7ecc
    restart: unless-stopped
    mem_limit: ${HOLO_EDGE_MEM_LIMIT:-512m}
    logging: *bounded-logging
    labels: *contract
    ports:
      - 127.0.0.1:44111:44111
    configs:
      - source: edge-caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      mastra:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  langfuse-postgres:
    image: docker.io/library/postgres@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
    restart: unless-stopped
    mem_limit: ${HOLO_LANGFUSE_POSTGRES_MEM_LIMIT:-2g}
    logging: *bounded-logging
    labels: *contract
    environment:
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER:?LANGFUSE_POSTGRES_USER is required}
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB:?LANGFUSE_POSTGRES_DB is required}
      # Fail-closed at compose-config time; runtime auth still uses the secret file.
      HOLO_LANGFUSE_POSTGRES_PASSWORD_CHECK: ${LANGFUSE_POSTGRES_PASSWORD:?LANGFUSE_POSTGRES_PASSWORD is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/langfuse_postgres_password
      TZ: UTC
      PGTZ: UTC
    secrets:
      - source: langfuse-postgres-password
        target: langfuse_postgres_password
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    restart: unless-stopped
    mem_limit: ${HOLO_LANGFUSE_CLICKHOUSE_MEM_LIMIT:-4g}
    logging: *bounded-logging
    labels: *contract
    user: "101:101"
    environment:
      CLICKHOUSE_DB: ${LANGFUSE_CLICKHOUSE_DB:?LANGFUSE_CLICKHOUSE_DB is required}
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:?LANGFUSE_CLICKHOUSE_USER is required}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?LANGFUSE_CLICKHOUSE_PASSWORD is required}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  langfuse-redis:
    image: docker.io/library/redis@sha256:91d0f7e8c748ec7a4c2b4fb2c4f84edab794dd91d01e095e38dc906db9d684ab
    restart: unless-stopped
    mem_limit: ${HOLO_LANGFUSE_REDIS_MEM_LIMIT:-512m}
    logging: *bounded-logging
    labels: *contract
    # Auth is written to a mode-0600 tmpfs redis.conf so the password never
    # appears in process argv or the healthcheck command string.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        AUTH="$$(cat /run/secrets/langfuse_redis_auth)";
        printf 'requirepass %s\nmaxmemory-policy noeviction\n' "$$AUTH" > /tmp/redis.conf;
        chmod 0600 /tmp/redis.conf;
        exec redis-server /tmp/redis.conf
    secrets:
      - source: langfuse-redis-auth
        target: langfuse_redis_auth
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "export REDISCLI_AUTH=\"$$(cat /run/secrets/langfuse_redis_auth)\"; redis-cli ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  langfuse-minio:
    image: cgr.dev/chainguard/minio@sha256:5f2b82fe2edccafed7902f423f171ae5e6b8b363fae72441c0e0e4289dc45555
    restart: unless-stopped
    mem_limit: ${HOLO_LANGFUSE_MINIO_MEM_LIMIT:-512m}
    logging: *bounded-logging
    labels: *contract
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export MINIO_ROOT_USER="$$(cat /run/secrets/langfuse_s3_access_key_id)";
        export MINIO_ROOT_PASSWORD="$$(cat /run/secrets/langfuse_s3_secret_access_key)";
        mkdir -p /data/langfuse;
        exec minio server --address ":9000" --console-address ":9001" /data
    secrets:
      - source: langfuse-s3-access-key-id
        target: langfuse_s3_access_key_id
      - source: langfuse-s3-secret-access-key
        target: langfuse_s3_secret_access_key
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker@sha256:37a7c4251b602e60fd39451e6c252195908bf61837d4e252adbd752c0809e835
    restart: unless-stopped
    mem_limit: ${HOLO_LANGFUSE_WORKER_MEM_LIMIT:-2g}
    logging: *bounded-logging
    labels: *contract
    environment: *langfuse-env
    depends_on:
      langfuse-postgres:
        condition: service_healthy
        restart: true
      langfuse-clickhouse:
        condition: service_healthy
        restart: true
      langfuse-redis:
        condition: service_healthy
        restart: true
      langfuse-minio:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3030/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  langfuse-web:
    # OBS-01 pin; OBS-05 rebuilds with NEXT_PUBLIC_BASE_PATH=/observability.
    image: docker.io/langfuse/langfuse@sha256:c2350a95d710f726f6466ffd47675eb704d0ff77fa1df1b9e6751ada6134ef75
    restart: unless-stopped
    mem_limit: ${HOLO_LANGFUSE_WEB_MEM_LIMIT:-2g}
    logging: *bounded-logging
    labels: *contract
    environment:
      <<: *langfuse-env
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:?LANGFUSE_INIT_ORG_ID is required}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:?LANGFUSE_INIT_ORG_NAME is required}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:?LANGFUSE_INIT_PROJECT_ID is required}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:?LANGFUSE_INIT_PROJECT_NAME is required}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?LANGFUSE_PUBLIC_KEY is required}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?LANGFUSE_SECRET_KEY is required}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?LANGFUSE_INIT_USER_EMAIL is required}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:?LANGFUSE_INIT_USER_NAME is required}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?LANGFUSE_INIT_USER_PASSWORD is required}
    depends_on:
      langfuse-postgres:
        condition: service_healthy
        restart: true
      langfuse-clickhouse:
        condition: service_healthy
        restart: true
      langfuse-redis:
        condition: service_healthy
        restart: true
      langfuse-minio:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/public/health || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib@sha256:13b685dc9f68fbbb0fce06d3be84e9d70ba5b90085d79dcbd4c4c0d909ee2d6e
    restart: unless-stopped
    mem_limit: ${HOLO_OTEL_COLLECTOR_MEM_LIMIT:-512m}
    logging: *bounded-logging
    labels: *contract
    user: "0:0"
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      LANGFUSE_OTLP_ENDPOINT: ${LANGFUSE_OTLP_ENDPOINT:?LANGFUSE_OTLP_ENDPOINT is required}
      LANGFUSE_AUTH_HEADER: ${LANGFUSE_AUTH_HEADER:?LANGFUSE_AUTH_HEADER is required}
    volumes:
      - ../otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
      - otel-queue:/var/lib/otelcol/queue
    depends_on:
      langfuse-web:
        condition: service_healthy
        restart: true
    healthcheck:
      # Distroless image (no /bin/sh, no wget): probe the collector binary
      # directly with the exec form, same pattern as edge's `caddy version`.
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres-data:
    name: ${HOLO_POSTGRES_VOLUME:-holocron-postgres}
  zero-cache-data:
    name: ${HOLO_ZERO_CACHE_VOLUME:-zero-cache}
  langfuse-postgres-data:
    name: ${HOLO_LANGFUSE_POSTGRES_VOLUME:-langfuse-postgres}
  clickhouse-data:
    name: ${HOLO_CLICKHOUSE_DATA_VOLUME:-clickhouse-data}
  clickhouse-logs:
    name: ${HOLO_CLICKHOUSE_LOGS_VOLUME:-clickhouse-logs}
  minio-data:
    name: ${HOLO_MINIO_VOLUME:-minio-data}
  redis-data:
    name: ${HOLO_REDIS_VOLUME:-redis-data}
  otel-queue:
    name: ${HOLO_OTEL_QUEUE_VOLUME:-otel-collector-queue}

configs:
  edge-caddyfile:
    content: |
      {
        auto_https off
        admin off
      }
      :44111 {
        handle /health {
          reverse_proxy mastra:4111
        }
        handle /mcp* {
          reverse_proxy mastra:4111 {
            flush_interval -1
          }
        }
        respond / "holocron edge ready" 200
      }

secrets:
  postgres-password:
    environment: POSTGRES_PASSWORD
  database-url:
    environment: DATABASE_URL
  mastra-api-key:
    environment: MASTRA_API_KEY
  fleet-key:
    environment: FLEET_KEY
  zero-admin-password:
    environment: ZERO_ADMIN_PASSWORD
  langfuse-postgres-password:
    environment: LANGFUSE_POSTGRES_PASSWORD
  langfuse-redis-auth:
    environment: LANGFUSE_REDIS_AUTH
  langfuse-s3-access-key-id:
    environment: LANGFUSE_S3_ACCESS_KEY_ID
  langfuse-s3-secret-access-key:

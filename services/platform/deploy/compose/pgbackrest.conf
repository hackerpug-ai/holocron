# Compose-native pgBackRest contract for CUTOVER-RELEASE-001.
# Versioned release config only — no live credentials. Runtime cipher/pass and
# S3 keys come from the operator secret store / env, never from this file.

[global]
repo1-type=s3
repo1-s3-bucket=holocron-backup
repo1-s3-endpoint=https://example.invalid.r2.cloudflarestorage.com
repo1-s3-region=auto
repo1-s3-uri-style=path
repo1-path=/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full=4
repo1-retention-diff=14
process-max=2
start-fast=y
log-level-console=info
log-level-file=off
# Production Postgres is published by Compose on host :44112 (container :5432).
# Never target 127.0.0.1:5432 as the production archive/backup endpoint.

[main]
pg1-host=127.0.0.1
pg1-port=44112
pg1-path=/var/lib/postgresql
pg1-user=holocron
pg1-database=holocron

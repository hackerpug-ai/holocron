# Compose-native pgBackRest contract for CUTOVER-RELEASE-001.
# Versioned release config only — no live credentials. Runtime cipher/pass and
# S3 keys come from the operator secret store / env, never from this file.
# Working configs are generated per-host by `holo backup:provision`
# (src/backup/r2-provision.ts renderPgbackrestConfig); this file is the
# non-secret topology template.

[global]
repo1-type=s3
repo1-s3-bucket=holocron-backup
repo1-s3-endpoint=https://example.invalid.r2.cloudflarestorage.com
repo1-s3-region=auto
repo1-s3-uri-style=path
repo1-path=/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full=4
repo1-retention-diff=14
process-max=2
start-fast=y
log-level-console=info
log-level-file=off

# Backup runners attach inside the Compose network (see the
# io.holocron.backup.* labels on the mastra/postgres services). Compose
# publishes no database host ports — the only published port is the edge at
# 127.0.0.1:44111 — so stanzas target service DNS names, never host ports.

[main]
pg1-host=postgres
pg1-port=5432
pg1-path=/var/lib/postgresql
pg1-user=holocron
pg1-database=holocron

# Langfuse application database (OBS D1: backup coverage for all Langfuse
# state). Same postgres image family, but its data volume mounts one level
# deeper than the PG18 main database.
[langfuse]
pg1-host=langfuse-postgres
pg1-port=5432
pg1-path=/var/lib/postgresql/data
pg1-user=langfuse
pg1-database=langfuse

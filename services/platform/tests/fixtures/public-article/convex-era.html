<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Public article</title>
  <meta name="description" content="Public article A byte-comparable article body with a link." />
  <meta property="og:title" content="Public article" />
  <meta property="og:description" content="Public article A byte-comparable article body with a link." />
  <meta property="og:type" content="article" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.7;
      color: #1a1a1a;
      background: #ffffff;
      margin: 0;
      padding: 0 16px;
    }
    .container {
      max-width: 720px;
      margin: 48px auto;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      background: #f0f0f0;
      color: #444;
      border-radius: 4px;
      padding: 2px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .date {
      color: #666;
      font-size: 0.85rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.25;
      margin: 0 0 28px;
      color: #111;
    }
    h2 { font-size: 1.5rem; font-weight: 700; margin: 2rem 0 0.75rem; color: #111; }
    h3 { font-size: 1.25rem; font-weight: 600; margin: 1.75rem 0 0.6rem; color: #111; }
    h4 { font-size: 1.1rem; font-weight: 600; margin: 1.5rem 0 0.5rem; color: #111; }
    h5 { font-size: 1rem; font-weight: 600; margin: 1.25rem 0 0.4rem; color: #333; }
    h6 { font-size: 0.95rem; font-weight: 600; margin: 1.25rem 0 0.4rem; color: #555; }
    p { margin: 0 0 1.1rem; }
    a { color: #0066cc; text-decoration: underline; }
    a:hover { color: #004499; }
    h2[id], h3[id], h4[id], h5[id], h6[id] { scroll-margin-top: 24px; }
    strong { font-weight: 700; }
    em { font-style: italic; }
    code {
      background: #f4f4f5;
      border-radius: 4px;
      padding: 2px 5px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.875em;
      color: #d63384;
    }
    pre {
      background: #f4f4f5;
      border-radius: 8px;
      padding: 16px 20px;
      overflow-x: auto;
      margin: 0 0 1.25rem;
    }
    pre code {
      background: none;
      padding: 0;
      color: #1a1a1a;
      font-size: 0.875rem;
    }
    blockquote {
      border-left: 4px solid #d4d4d4;
      margin: 0 0 1.25rem;
      padding: 4px 0 4px 18px;
      color: #555;
    }
    blockquote p:last-child { margin-bottom: 0; }
    ul, ol { margin: 0 0 1.1rem; padding-left: 24px; }
    li { margin-bottom: 4px; }
    hr {
      border: none;
      border-top: 1px solid #e5e5e5;
      margin: 2rem 0;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 0 0 1.25rem;
      font-size: 0.9rem;
    }
    th, td {
      border: 1px solid #d4d4d4;
      padding: 8px 14px;
      text-align: left;
    }
    th { background: #f4f4f5; font-weight: 600; }
    .content { margin-bottom: 48px; }
    footer {
      border-top: 1px solid #e5e5e5;
      padding-top: 20px;
      font-size: 0.8rem;
      color: #999;
      text-align: center;
    }
    @media (max-width: 600px) {
      h1 { font-size: 1.5rem; }
      .container { margin: 24px auto; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="meta">
      <span class="badge">gate</span>
      <span class="badge">test</span>
      <span class="date">July 18, 2026</span>
    </div>
    <h1>Public article</h1>
    <div class="content">
      <p>A byte-comparable article body with <a href="https://example.com" rel="noopener noreferrer">a link</a>.</p>
    </div>
    <footer>Shared from Holocron</footer>
  </div>
</body>
</html>

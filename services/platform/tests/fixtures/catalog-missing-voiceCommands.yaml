# 12-convex-source-catalog.yaml
# Machine-readable migration contract: one approved entry per legacy table/field/storage ref.
# Authority for UC-DATA-01 / UC-DATA-05 / T-DATA-020 / T-DATA-016. Sprint 02 deliverable.
version: "1"
catalog_id: 12-convex-source-catalog
prd: mk6-migration
owner_default: platform-data
approval_default: APR-MIG-2026-S02-001
dispositions: [preserve, merge, drop, regenerate, archive]
table_count_expected: 60
storage_ref_count_expected: 6

system_exclusions:
  - name: _tables
    disposition: archive
    reason: Convex export system metadata; not a domain table
    approval: APR-MIG-SYS-EXCL-001
    owner: platform-data
  - name: _scheduled_functions
    disposition: drop
    reason: Convex scheduler state; recreated in target runtime
    approval: APR-MIG-SYS-EXCL-002
    owner: platform-data
  - name: _storage
    disposition: preserve
    reason: Blob store walked via storage_refs asset inventory; not a domain table
    approval: APR-MIG-SYS-EXCL-003
    owner: platform-data

merges:
  business:
    description: Four near-identical business pipelines collapse 12→3 analysis_* tables
    sources:
      - revenueValidationSessions
      - competitiveAnalysisSessions
      - aiRoiSessions
      - flightsSessions
      - revenueValidationCompetitors
      - competitiveAnalysisCompetitors
      - competitiveAnalysisFeatures
      - aiRoiOpportunities
      - flightsRoutes
      - flightsPriceCalendar
      - revenueValidationEvidence
      - aiRoiEvidence
    targets: [analysis_sessions, analysis_items, analysis_evidence]
    discriminators:
      analysis_sessions: type
      analysis_items: kind
      analysis_evidence: kind
    approval: APR-MIG-MERGE-BUSINESS-12-3
  research:
    description: Two overlapping research systems collapse 5→3 research_* tables
    sources:
      - researchSessions
      - deepResearchSessions
      - researchIterations
      - deepResearchIterations
      - researchFindings
    targets: [research_sessions, research_iterations, research_findings]
    discriminators:
      research_sessions: system
      research_iterations: system
      research_findings: system
    approval: APR-MIG-MERGE-RESEARCH-5-3


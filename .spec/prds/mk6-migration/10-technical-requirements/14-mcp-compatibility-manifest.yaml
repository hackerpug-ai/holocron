        embeddingRegenerated: { type: boolean }
        embeddingDimensions: { type: integer }
    defaults: {}
    errors:
      - code: NOT_FOUND
        description: "Tool ID does not exist"
      - code: VALIDATION_ERROR
        description: "No updatable fields provided"
      - code: EMBEDDING_FAILED

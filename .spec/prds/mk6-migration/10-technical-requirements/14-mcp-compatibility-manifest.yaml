        description: "Postgres start_assimilation insert failed"
    pagination: null
    side_effects: "INSERTS assimilation_sessions row; when autoApprove is true, runs the Mastra assimilate-repo workflow (git acquire + ACP crawl + cite/cover + report) and streams progress"
    idempotency: "Semi-idempotent by repositoryUrl — Postgres executor returns the existing assimilation_sessions row when one is already in progress for the same repo."
    replay:
      idempotency_key: [repositoryUrl]
      stored_result: sessionId
    transports: [stdio, streamable-http]

  - id: approve_assimilation_plan

          additionalProperties: true
      required: [title, sourceType, category]
    output_schema:
      type: object
      properties:
        toolId: { type: string }
        title: { type: string }
        embeddingStatus:
          type: string
          enum: [completed, pending, failed]
        embeddingDimensions: { type: integer }
    defaults:
      status: draft
      description: null
      content: null
    errors:
      - code: VALIDATION_ERROR
        description: "Missing required fields (title, sourceType, category)"
      - code: EMBEDDING_FAILED
        description: "Embedding generation failed"
      - code: INTERNAL_SERVER_ERROR
        description: "Convex createWithEmbedding action failed"
    pagination: null
    side_effects: "INSERTS tools row + generates embedding (toolbelt/storage:createWithEmbedding action)"
    idempotency: "Not natively idempotent — duplicate (title, sourceType) creates a new row."
    replay:
      idempotency_key: [title, sourceType, category]
      stored_result: toolId
    transports: [stdio, streamable-http]
    fixtures: null

  - id: search_tools

        description: "Session is not in pending_approval status"
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres reject_assimilation_plan update failed"
    pagination: null
    side_effects: "UPDATES assimilation_sessions status → rejected|planning via executePostgresMcpTool reject_assimilation_plan"
    idempotency: "Idempotent by (sessionId, feedback) — rejecting with same feedback is a safe no-op."
    replay:
      idempotency_key: [sessionId, feedback]
      stored_result: rejected
    transports: [stdio, streamable-http]


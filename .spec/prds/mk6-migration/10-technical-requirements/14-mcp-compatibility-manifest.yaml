# MCP Compatibility Manifest — Holocron MCP Server
# Sprint-03 / mcp-manifest-01: Header + 44-tool skeleton
# Per-tool schemas, defaults, errors, pagination, fixtures, etc. are populated by mcp-manifest-02.
#
# Source of truth for tool IDs: holocron-mcp/src/mastra/stdio.ts (createTool calls, lines 139-789)

protocol: "2025-11-25"

transports:
  - stdio
  - streamable-http

stateless: true
no_server_sampling: true

auth_policy:
  stdio:
    trust_boundary: "Local process — credentials injected via environment variables (CONVEX_URL, CONVEX_DEPLOYMENT, API keys). No additional auth layer."
  streamable_http:
    type: "api-key"
    header: "Authorization"
    scheme: "bearer"
    origin_validation: true
    allowed_origins: null  # mcp-manifest-02 to populate
    rate_limit: null       # mcp-manifest-02 to populate

cancellation_policy:
  posture: "cooperative"
  description: >
    Clients may send cancellation notifications per MCP 2025-11-25.
    The server aborts in-flight tool execution when a cancellation is received.
    Long-running operations (assimilation sessions, transcript jobs) are dispatched
    to Convex and are not directly cancellable via the MCP transport — the client
    must use the cancel_assimilation tool for those workflows.
  supported: true


    defaults: {}
    errors:
      - code: NOT_FOUND
        description: "Session does not exist"
      - code: INVALID_STATE
        description: "Session is not in pending_approval status"
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres approve_assimilation_plan update failed"
    pagination: null
    side_effects: "UPDATES assimilation_sessions status → running via executePostgresMcpTool approve_assimilation_plan"
    idempotency: "Idempotent by sessionId — approving an already-approved session is a safe no-op or returns INVALID_STATE."
    replay:
      idempotency_key: [sessionId]
      stored_result: approved
    transports: [stdio, streamable-http]


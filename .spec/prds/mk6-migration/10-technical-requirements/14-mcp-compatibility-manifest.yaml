              sourceUrl: { type: string }
              sourceType: { type: string }
              category: { type: string }
              status: { type: string }
              tags: { type: array, items: { type: string } }
              score: { type: number }
              createdAt: { type: number }
              updatedAt: { type: number }
        totalResults: { type: integer }
        searchMethod:

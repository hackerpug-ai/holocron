      - code: INVALID_URL
        description: "URL is not parseable / non-http(s) / loopback, private, or link-local host (returned as success:false)"
      - code: UNSUPPORTED_HOST
        description: "Could not extract a YouTube video id (returned as success:false)"
      - code: FETCH_FAILED
        description: "Watch page or caption track fetch failed (returned as success:false)"
      - code: PARSE_FAILED
        description: "Caption track could not be parsed (returned as success:false)"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]

  # ── Improvement Requests ──────────────────────────────────────
  - id: search_improvements
    input_schema:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: "Search query for finding similar improvements"
        limit:
          type: integer
          minimum: 1
          description: "Max results (default 5)"
      required: [query]
    output_schema:
      type: array
      description: "Array of similar improvement requests ranked by relevance"
      items:
        type: object
        properties:
          _id: { type: string }
          description: { type: string }
          status: { type: string }
          score: { type: number }
    defaults:
      limit: 5
    errors:
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres findSimilar/search path failed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]

  - id: get_improvement
    input_schema:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          description: "Improvement request ID"
      required: [id]
    output_schema:
      type: object
      nullable: true
      properties:
        _id: { type: string }
        description: { type: string }
        status: { type: string }
        sourceScreen: { type: string }
        closedReason: { type: string }
        closedAt: { type: number }
        createdAt: { type: number }
    defaults: {}
    errors:
      - code: NOT_FOUND
        description: "Improvement does not exist — returns null"
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres query failed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]

  - id: list_improvements
    input_schema:
      type: object
      properties:
        status:
          type: string
          enum: [open, closed]
          description: "Filter by status. Omit to list all non-merged items."
        limit:
          type: integer
          minimum: 1
          description: "Max results (default 20)"
      required: []
    output_schema:
      type: array
      items:
        type: object
        properties:
          _id: { type: string }
          description: { type: string }
          status: { type: string }
          sourceScreen: { type: string }
          createdAt: { type: number }
    defaults:
      limit: 20
      status: null
    errors:
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres query failed"
    pagination:
      type: limit-only
      limit_default: 20
      limit_max: 1000
      ordering_field: createdAt
      ordering_direction: desc
      cursor_field: null
      has_more_field: null
      next_cursor_field: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]

  - id: add_improvement
    input_schema:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          description: "One or more improvements to submit"
          items:
            type: object
            properties:
              description:
                type: string
                minLength: 1
                description: "Description of the improvement"
              sourceScreen:
                type: string
                description: "Screen where improvement was identified"
            required: [description]
      required: [items]
    output_schema:
      type: object
      properties:
        created: { type: integer }
        ids:
          type: array
          items: { type: string }
    defaults:
      items[].sourceScreen: mcp
    errors:
      - code: VALIDATION_ERROR
        description: "items array is empty or missing description"
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres add_improvement insert failed"
    pagination: null
    side_effects: "INSERTS improvement_requests rows via executePostgresMcpTool add_improvement — one per item"
    idempotency: "Not natively idempotent — duplicate submissions create new rows. No content-based dedup."
    replay:
      idempotency_key: [items]
      stored_result: ids
    transports: [stdio, streamable-http]

  - id: close_improvement
    input_schema:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          description: "Improvement request ID to close"
        reason:
          type: string
          description: "Why this improvement is being closed"
        evidence:
          type: array
          items: { type: string }
          description: "File paths, PR links, or commit hashes proving completion"
      required: [id]
    output_schema:
      type: object
      properties:
        id: { type: string }
        status: { type: string, const: closed }
    defaults:
      reason: null
      evidence: null
    errors:
      - code: NOT_FOUND
        description: "Improvement ID does not exist"
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres improvement status update failed"
    pagination: null
    side_effects: "UPDATES improvement_requests status → completed via executePostgresMcpTool close_improvement"
    idempotency: "Idempotent by id — closing an already-closed improvement is a safe no-op."
    replay:
      idempotency_key: [id]
      stored_result: status
    transports: [stdio, streamable-http]

  - id: set_improvement_status
    input_schema:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          description: "Improvement request ID"
        status:
          type: string
          enum: [open, closed]
          description: "Target status"
        reason:
          type: string
          description: "Reason when closing (ignored when reopening)"
        evidence:
          type: array
          items: { type: string }
          description: "Evidence when closing (ignored when reopening)"
      required: [id, status]
    output_schema:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [open, closed] }
    defaults:
      reason: null
      evidence: null
    errors:
      - code: NOT_FOUND
        description: "Improvement ID does not exist"
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres improvement status update failed"
    pagination: null
    side_effects: "UPDATES improvement_requests status open|closed via executePostgresMcpTool set_improvement_status"
    idempotency: "Idempotent by (id, status) — setting the same status is a safe no-op."
    replay:
      idempotency_key: [id, status]
      stored_result: status
    transports: [stdio, streamable-http]

  # ── Recommendations ───────────────────────────────────────────
  - id: findRecommendations
    input_schema:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: "The recommendation request"
        count:
          type: integer
          minimum: 3
          maximum: 7
          description: "Number of recommendations (3-7, default 5)"
        location:
          type: string
          description: "Geographic constraint"
        constraints:
          type: array
          items: { type: string }
          description: "Additional constraints"
      required: [query]
    output_schema:
      type: array
      description: "Inline recommendation results with contact details"
      items:
        type: object
        properties:
          name: { type: string }
          recommendation: { type: string }
          contact: { type: object }
    defaults:
      count: 5
      location: null
      constraints: null
    errors:
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres findRecommendations path failed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]

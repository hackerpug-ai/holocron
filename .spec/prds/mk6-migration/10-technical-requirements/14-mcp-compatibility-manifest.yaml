              ruleName: { type: string }
              ruleType: { type: string }
              ruleValue: {}
              weight: { type: number }
    defaults: {}
    errors:
      - code: INTERNAL_SERVER_ERROR
        description: "Convex query failed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]
    fixtures: null

  # ── Toolbelt ──────────────────────────────────────────────────

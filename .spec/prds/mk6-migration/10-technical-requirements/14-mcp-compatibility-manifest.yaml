# MCP Compatibility Manifest — Holocron MCP Server
# Sprint-03 / mcp-manifest-01: Header + 44-tool skeleton
# Per-tool schemas, defaults, errors, pagination, fixtures, etc. are populated by mcp-manifest-02.
#
# Source of truth for tool IDs: holocron-mcp/src/mastra/stdio.ts (createTool calls, lines 139-789)

protocol: "2025-11-25"

transports:
  - stdio
  - streamable-http

stateless: true
no_server_sampling: true

auth_policy:
  stdio:
    trust_boundary: "Local process — credentials injected via environment variables (CONVEX_URL, CONVEX_DEPLOYMENT, API keys). No additional auth layer."
  streamable_http:
    type: "api-key"
    header: "Authorization"
    scheme: "bearer"
    origin_validation: true
    allowed_origins: null  # mcp-manifest-02 to populate
    rate_limit: null       # mcp-manifest-02 to populate

cancellation_policy:
  posture: "cooperative"
  description: >
    Clients may send cancellation notifications per MCP 2025-11-25.
    The server aborts in-flight tool execution when a cancellation is received.
    Long-running operations (assimilation sessions, transcript jobs) are dispatched
    to Convex and are not directly cancellable via the MCP transport — the client
    must use the cancel_assimilation tool for those workflows.
  supported: true

tools:
  # ── Research Session ──────────────────────────────────────────
  - id: get_research_session
    input_schema:
      type: object
      properties:
        sessionId:
          type: string
          minLength: 1
      required: [sessionId]
    output_schema:
      type: object
      nullable: true
      description: "ResearchSession or null if not found"
      properties:
        _id: { type: string }
        sessionId: { type: string }
        topic: { type: string }
        status: { type: string }
        iterations: { type: array }
    defaults: {}
    errors:
      - code: NOT_FOUND
        description: "Session does not exist — returns null"
      - code: INTERNAL_SERVER_ERROR
        description: "Convex query failed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]
    fixtures: null

  - id: search_research
    input_schema:
      type: object
      properties:
        query:
          type: string
          minLength: 1
        limit:
          type: integer
          minimum: 1
      required: [query]
    output_schema:
      type: object
      properties:
        sessions:
          type: array
          items:
            type: object
            properties:
              sessionId: { type: string }
              topic: { type: string }
              relevanceScore: { type: number }
              status: { type: string }
              createdAt: { type: number }
        totalResults: { type: integer }
    defaults:
      limit: 10
    errors:
      - code: INTERNAL_SERVER_ERROR
        description: "Convex query failed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]
    fixtures: null

  # ── Search ────────────────────────────────────────────────────
  - id: search_fts
    input_schema:
      type: object
      properties:
        query:
          type: string
          minLength: 1
        limit:
          type: integer
          minimum: 1
      required: [query]
    output_schema:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              _id: { type: string }
              title: { type: string }
              score: { type: number }
              content: { type: string }
        totalResults: { type: integer }
    defaults:
      limit: 20
    errors:
      - code: INTERNAL_SERVER_ERROR
        description: "Convex FTS5 query failed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]
    fixtures: null

  - id: search_vector
    input_schema:
      type: object
      properties:
        embedding:
          type: array
          items: { type: number }
        limit:
          type: integer
          minimum: 1
      required: [embedding]
    output_schema:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              _id: { type: string }
              title: { type: string }
              score: { type: number }
              content: { type: string }

    defaults:
      limit: 20
    errors:
      - code: VALIDATION_ERROR
        description: "Embedding dimension mismatch"
      - code: INTERNAL_SERVER_ERROR
        description: "Convex vector search failed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]
    fixtures: null

  - id: hybrid_search
    input_schema:
      type: object
      properties:
        query:
          type: string
          minLength: 1
        limit:
          type: integer
          minimum: 1
      required: [query]
    output_schema:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              _id: { type: string }
              title: { type: string }
              score: { type: number }
              content: { type: string }
        totalResults: { type: integer }
        searchMethod:
          type: string
          enum: [hybrid, fts_only, vector_only]
    defaults:
      limit: 20
    errors:
      - code: INTERNAL_SERVER_ERROR
        description: "Both hybrid and FTS fallback failed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]
    fixtures: null

  # ── Documents ─────────────────────────────────────────────────
  - id: store_document
    input_schema:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        metadata:
          type: object
          additionalProperties: true
      required: [title, content]
    output_schema:
      type: object
      properties:
        documentId: { type: string }
        title: { type: string }
        embeddingStatus:
          type: string
          enum: [pending, completed, failed]
        embeddingDimensions: { type: integer }
    defaults:
      metadata: {}
      metadata.category: general
      metadata.date: "auto (today's ISO date)"
    errors:
      - code: VALIDATION_ERROR
        description: "Title or content empty after Zod validation"
      - code: EMBEDDING_FAILED
        description: "OpenAI embedding generation failed"
      - code: INTERNAL_SERVER_ERROR
        description: "Convex createWithEmbedding mutation failed"
    pagination: null
    side_effects: "INSERTS documents row + generates embedding via OpenAI (documents/storage:createWithEmbedding action)"
    idempotency: "Not natively idempotent — duplicate (title + content) creates a new row. De-dup must be caller-side."
    replay:
      idempotency_key: [title, content]
      stored_result: documentId
    transports: [stdio, streamable-http]
    fixtures: null

  - id: update_document
    input_schema:
      type: object
      properties:
        documentId:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        metadata:
          type: object
          additionalProperties: true
      required: [documentId]
    output_schema:
      type: object
      properties:
        documentId: { type: string }
        updated: { type: boolean }
        embeddingStatus:
          type: string
          enum: [pending, completed, failed]
        embeddingRegenerated: { type: boolean }
        embeddingDimensions: { type: integer }
    defaults: {}
    errors:
      - code: NOT_FOUND
        description: "Document ID does not exist"
      - code: VALIDATION_ERROR
        description: "No updatable fields provided (title/content/metadata all absent)"
      - code: EMBEDDING_FAILED
        description: "Re-embedding generation failed"
      - code: INTERNAL_SERVER_ERROR
        description: "Convex updateWithEmbedding mutation failed"
    pagination: null
    side_effects: "UPDATES documents row + regenerates embedding if title/content changed (documents/storage:updateWithEmbedding action)"
    idempotency: "Idempotent by documentId — repeating the same update with identical fields yields the same result."
    replay:
      idempotency_key: [documentId]
      stored_result: documentId
    transports: [stdio, streamable-http]
    fixtures: null

  - id: share_document
    input_schema:
      type: object
      properties:
        documentId:
          type: string
          minLength: 1
        isPublic:
          type: boolean
      required: [documentId, isPublic]
    output_schema:
      type: object
      properties:
        documentId: { type: string }
        isPublic: { type: boolean }
        shareToken: { type: string }
        shareUrl: { type: string }
    defaults: {}
    errors:
      - code: NOT_FOUND
        description: "Document ID does not exist"
      - code: INTERNAL_SERVER_ERROR
        description: "Convex publishDocument/unpublishDocument mutation failed"
    pagination: null
    side_effects: "UPDATES documents row (isPublic flag) + creates or removes shareToken (documents/mutations:publishDocument or :unpublishDocument)"
    idempotency: "Idempotent by (documentId, isPublic) — publishing an already-published doc or unpublishing an already-private doc is a safe no-op."
    replay:
      idempotency_key: [documentId, isPublic]
      stored_result: shareToken
    transports: [stdio, streamable-http]
    fixtures: null

  - id: get_document
    input_schema:
      type: object
      properties:
        documentId:
          type: string
          minLength: 1
      required: [documentId]
    output_schema:
      type: object
      nullable: true
      description: "Document or null. If documentId contains ':', queries by Convex ID; otherwise by title."
    defaults: {}
    errors:
      - code: NOT_FOUND
        description: "Document does not exist — returns null"
      - code: INTERNAL_SERVER_ERROR
        description: "Convex query failed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]
    fixtures: null

  - id: list_documents
    input_schema:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
        cursor:
          type: string
      required: []
    output_schema:
      type: object
      properties:
        documents:
          type: array
          items:
            type: object
        nextCursor:
          type: string
          nullable: true
        hasMore: { type: boolean }
    defaults:
      limit: 50
    errors:
      - code: INTERNAL_SERVER_ERROR
        description: "Convex query failed"
    pagination:
      type: cursor
      limit_default: 50
      limit_max: 1000
      ordering_field: _creationTime
      ordering_direction: desc
      cursor_field: cursor
      has_more_field: hasMore
      next_cursor_field: nextCursor
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]
    fixtures: null

  # ── Subscriptions ─────────────────────────────────────────────
  - id: add_subscription
    input_schema:
      type: object
      properties:
        sourceType:
          type: string
          enum: [youtube, newsletter, changelog, reddit, ebay, whats-new, github]
        identifier:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
        feedUrl:
          type: string
          format: uri
      required: [sourceType, identifier, name]
    output_schema:
      type: object
      properties:
        subscriptionId: { type: string }
        sourceType: { type: string }
        identifier: { type: string }
        name: { type: string }
        createdAt: { type: number }
    defaults: {}
    errors:
      - code: VALIDATION_ERROR
        description: "Missing required fields or invalid sourceType"
      - code: DUPLICATE_SUBSCRIPTION
        description: "Subscription with same sourceType + identifier already exists"
      - code: INTERNAL_SERVER_ERROR
        description: "Convex add mutation failed"
    pagination: null
    side_effects: "INSERTS subscriptions row (subscriptions/mutations:add)"
    idempotency: "Semi-idempotent by (sourceType, identifier) — Convex backend deduplicates existing subscriptions with the same key."
    replay:
      idempotency_key: [sourceType, identifier]
      stored_result: subscriptionId
    transports: [stdio, streamable-http]
    fixtures: null

  - id: remove_subscription
    input_schema:
      type: object
      properties:
        subscriptionId:
          type: string
          minLength: 1
      required: [subscriptionId]
    output_schema:
      type: object
      properties:
        deleted: { type: boolean }
        subscription:
          type: object
          properties:
            _id: { type: string }
            sourceType: { type: string }
            identifier: { type: string }
            name: { type: string }
    defaults: {}
    errors:
      - code: NOT_FOUND
        description: "Subscription ID does not exist"
      - code: INTERNAL_SERVER_ERROR
        description: "Convex remove mutation failed"
    pagination: null
    side_effects: "DELETES subscriptions row (subscriptions/mutations:remove)"
    idempotency: "Idempotent by subscriptionId — deleting an already-deleted subscription returns NOT_FOUND."
    replay:
      idempotency_key: [subscriptionId]
      stored_result: deleted
    transports: [stdio, streamable-http]
    fixtures: null

  - id: list_subscriptions
    input_schema:
      type: object
      properties:
        sourceType:
          type: string
          enum: [youtube, newsletter, changelog, reddit, ebay, whats-new]
        autoResearchOnly:

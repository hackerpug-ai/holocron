# MCP Compatibility Manifest — Holocron Postgres MCP Gateway
# Frozen dual-transport contract for the 50 registered tools (stdio + streamable-http).
# Tool IDs / schemas track services/platform/src/tools/registry.ts and executePostgresMcpTool.
# Success/error/replay fixtures resolve by filename convention only:
#   {toolId}_{success|error|replay}.json under services/platform/tests/fixtures/mcp-manifest/
#

protocol: "2025-11-25"

transports:
  - stdio
  - streamable-http

stateless: true
no_server_sampling: true

auth_policy:
  stdio:
    trust_boundary: "Local process — credentials injected via environment variables (DATABASE_URL, API keys). No additional auth layer."
  streamable_http:
    type: "api-key"
    header: "Authorization"
    scheme: "bearer"
    origin_validation: true
    # Same-origin only: gateway derives allowedOrigins from request.url (gateway.ts)
    allowed_origins: same-origin
    rate_limit: not_applicable  # 01-scope.md (2026-08-07) — MCP transport rate limiting excluded under auth-hardening

cancellation_policy:
  posture: "cooperative"
  description: >
    Clients may send cancellation notifications per MCP 2025-11-25.
    The gateway threads AbortSignal via extra.signal into executePostgresMcpTool
    (gateway.ts), which aborts in-flight Postgres executor work cooperatively.
    Long-running retailer/search work honours the abort signal; session-level
    assimilation workflows are cancelled via cancel_assimilation against Postgres.
  supported: true

tools:
  # ── Research Session ──────────────────────────────────────────
  - id: get_research_session
    input_schema:
      type: object
      properties:
        sessionId:
          type: string
          minLength: 1
      required: [sessionId]
    output_schema:
      type: object
      description: "ResearchSession fields; empty object if not found (bare ZodObject — no top-level nullable)"
      properties:
        _id: { type: string }
        sessionId: { type: string }
        topic: { type: string }
        status: { type: string }
        iterations: { type: array }
    defaults: {}
    errors:
      - code: NOT_FOUND
        description: "Session does not exist — returns null"
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres query failed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]

  - id: search_research
    input_schema:
      type: object
      properties:
        query:
          type: string
          minLength: 1
        limit:
          type: integer
          minimum: 1
      required: [query]
    output_schema:
      type: object
      properties:
        sessions:
          type: array
          items:
            type: object
            properties:
              sessionId: { type: string }
              topic: { type: string }
              relevanceScore: { type: number }
              status: { type: string }
              createdAt: { type: number }
        totalResults: { type: integer }
    defaults:
      limit: 10
    errors:
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres query failed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]

  - id: deep_research
    input_schema:
      type: object
      properties:
        topic: { type: string, minLength: 1 }
        mode: { type: string, enum: [auto, depth, breadth] }
        maxRounds: { type: integer, minimum: 1 }
        focus: { type: array, items: { type: string } }
        onBudgetExhausted: { type: string, enum: [partial, ask] }
        conversationId: { type: string, format: uuid }
      required: [topic]
    output_schema:
      type: object
      properties:
        sessionId: { type: string, format: uuid }
        status: { type: string }
        mode: { type: string, enum: [quick, depth, breadth] }
        existing: { type: boolean }
        pollAfterMs: { type: integer }
        estimatedMs: { type: integer }
    defaults:
      mode: auto
      maxRounds: null
      focus: null
      onBudgetExhausted: partial
      conversationId: null
    errors:
      - code: INVALID_ARGUMENT
        description: "topic is required"
      - code: INTERNAL_SERVER_ERROR
        description: "research kickoff failed"
    pagination: null
    side_effects: "CREATES research_sessions row and starts async research worker via kickoffResearch"
    idempotency: "Idempotent by topic+mode+conversationId digest; reused non-terminal session returns existing:true"
    replay:
      idempotency_key: [topic, mode, conversationId]
      stored_result: sessionId
    transports: [stdio, streamable-http]

  - id: quick_research
    input_schema:
      type: object
      properties:
        topic: { type: string, minLength: 1 }
        focus: { type: array, items: { type: string } }
        conversationId: { type: string, format: uuid }
      required: [topic]
    output_schema:
      type: object
      properties:
        sessionId: { type: string, format: uuid }
        status: { type: string }
        mode: { type: string, enum: [quick, depth, breadth] }
        existing: { type: boolean }
        pollAfterMs: { type: integer }
        estimatedMs: { type: integer }
    defaults:
      focus: null
      conversationId: null
    errors:
      - code: INVALID_ARGUMENT
        description: "topic is required"
      - code: INTERNAL_SERVER_ERROR
        description: "research kickoff failed"
    pagination: null
    side_effects: "CREATES research_sessions row (system=simple) and starts async quick research worker"
    idempotency: "Idempotent by topic+quick+conversationId digest; reused non-terminal session returns existing:true"
    replay:
      idempotency_key: [topic, conversationId]
      stored_result: sessionId
    transports: [stdio, streamable-http]

  - id: deep_research_result
    input_schema:
      type: object
      properties:
        sessionId: { type: string, format: uuid }
        waitMs: { type: integer, minimum: 0, maximum: 60000 }
        includeFindings: { type: boolean }
      required: [sessionId]
    output_schema:
      type: object
      properties:
        sessionId: { type: string, format: uuid }
        status: { type: string }
        phase: { type: string }
        terminal: { type: boolean }
        mode: { type: string, enum: [quick, depth, breadth] }
        progress: { type: object }
        summary: { type: string }
        findings: {}
        gaps: {}
        documentId: { type: string, format: uuid }
        coverageScore: { type: number }
        partial: { type: boolean }
        stopReason: { type: string }
        elapsedMs: { type: integer }
        nextPollAfterMs: { type: integer }
        lastIteration: { type: object }
        gate: { type: object }
    defaults:
      waitMs: 0
      includeFindings: false
    errors:
      - code: NOT_FOUND
        description: "research session does not exist"
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres query failed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]

  - id: deep_research_control
    input_schema:
      type: object
      properties:
        sessionId: { type: string, format: uuid }
        action: { type: string, enum: [cancel, steer] }
        note: { type: string }
        addSubQuestions: { type: array, items: { type: string } }
        dropSubQuestions: { type: array, items: { type: string } }
        stop: { type: boolean }
        extendBudget: { type: boolean }
        controlRequestKey: { type: string }
      required: [sessionId, action]
    output_schema:
      type: object
      properties:
        sessionId: { type: string, format: uuid }
        action: { type: string, enum: [cancel, steer] }
        accepted: { type: boolean }
        status: { type: string }
        controlRequestKey: { type: string }
        replay: { type: boolean }
        appliesAtRound: { type: integer }
    defaults:
      note: null
      addSubQuestions: null
      dropSubQuestions: null
      stop: null
      extendBudget: null
      controlRequestKey: null
    errors:
      - code: NOT_FOUND
        description: "research session does not exist"
      - code: INVALID_STATE
        description: "session is not cancellable/steerable"
    pagination: null
    side_effects: "UPDATES research_sessions status/cancel_requested_at or plan.controlRequests via deep_research_control"
    idempotency: "Idempotent by controlRequestKey (or derived hash of control payload); cancel/steer replays return replay:true"
    replay:
      idempotency_key: [sessionId, action, controlRequestKey]
      stored_result: controlRequestKey
    transports: [stdio, streamable-http]

  # ── Search ────────────────────────────────────────────────────
  - id: search_fts
    input_schema:
      type: object
      properties:
        query:
          type: string
          minLength: 1
        limit:
          type: integer
          minimum: 1
      required: [query]
    output_schema:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              _id: { type: string }
              title: { type: string }
              score: { type: number }
              content: { type: string }
        totalResults: { type: integer }
    defaults:
      limit: 20
    errors:
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres FTS query failed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]

  - id: search_vector
    input_schema:
      type: object
      properties:
        embedding:
          type: array
          items: { type: number }
        limit:
          type: integer
          minimum: 1
      required: [embedding]
    output_schema:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              _id: { type: string }
              title: { type: string }
              score: { type: number }
              content: { type: string }
        totalResults: { type: integer }
    defaults:
      limit: 20
    errors:
      - code: VALIDATION_ERROR
        description: "Embedding dimension mismatch"
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres vector search failed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]

  - id: hybrid_search
    input_schema:
      type: object
      properties:
        query:
          type: string
          minLength: 1
        limit:
          type: integer
          minimum: 1
      required: [query]
    output_schema:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              _id: { type: string }
              title: { type: string }
              score: { type: number }
              content: { type: string }
        totalResults: { type: integer }
        searchMethod:
          type: string
          enum: [hybrid, fts_only, vector_only]
    defaults:
      limit: 20
    errors:
      - code: INTERNAL_SERVER_ERROR
        description: "Both hybrid and FTS fallback failed"
      - code: ROLE_UNAVAILABLE
        description: "Fleet embed role is unreachable; hybrid retrieval fails closed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]

  # ── Documents ─────────────────────────────────────────────────
  - id: store_document
    input_schema:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        metadata:
          type: object
          additionalProperties: true
      required: [title, content]
    output_schema:
      type: object
      properties:
        documentId: { type: string }
        title: { type: string }
        embeddingStatus:
          type: string
          enum: [pending, completed, failed]
        embeddingDimensions: { type: integer }
    defaults:
      metadata: {}
      metadata.category: general
      metadata.date: "auto (today's ISO date)"
    errors:
      - code: VALIDATION_ERROR
        description: "Title or content empty after Zod validation"
      - code: EMBEDDING_FAILED
        description: "OpenAI embedding generation failed"
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres store_document insert failed"
    pagination: null
    side_effects: "INSERTS documents row via executePostgresMcpTool store_document (documents table; embeddingStatus pending)"
    idempotency: "Not natively idempotent — duplicate (title + content) creates a new row. De-dup must be caller-side."
    replay:
      idempotency_key: [title, content]
      stored_result: documentId
    transports: [stdio, streamable-http]

  - id: update_document
    input_schema:
      type: object
      properties:
        documentId:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        metadata:
          type: object
          additionalProperties: true
      required: [documentId]
    output_schema:
      type: object
      properties:
        documentId: { type: string }
        updated: { type: boolean }
        embeddingStatus:
          type: string
          enum: [pending, completed, failed]
        embeddingRegenerated: { type: boolean }
        embeddingDimensions: { type: integer }
    defaults: {}
    errors:
      - code: NOT_FOUND
        description: "Document ID does not exist"
      - code: VALIDATION_ERROR
        description: "No updatable fields provided (title/content/metadata all absent)"
      - code: EMBEDDING_FAILED
        description: "Re-embedding generation failed"
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres update_document failed"
    pagination: null
    side_effects: "UPDATES documents row via executePostgresMcpTool update_document (documents table; embeddingStatus pending)"
    idempotency: "Idempotent by documentId — repeating the same update with identical fields yields the same result."
    replay:
      idempotency_key: [documentId]
      stored_result: documentId
    transports: [stdio, streamable-http]

  - id: share_document
    input_schema:
      type: object
      properties:
        documentId:
          type: string
          minLength: 1
      required: [documentId]
    output_schema:
      type: object
      properties:
        documentId: { type: string }
        isPublic: { type: boolean, const: true }
        shareToken: { type: string }
        shareUrl: { type: string }
      required: [documentId, isPublic, shareToken, shareUrl]
    defaults: {}
    errors:
      - code: NOT_FOUND
        description: "Document ID does not exist"
      - code: INVALID_ARGUMENT
        description: "isPublic:false is rejected; call unshare_document"
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres share_document update failed"
    pagination: null
    side_effects: "UPDATES documents is_public/share_token via executePostgresMcpTool share_document (documents table)"
    idempotency: "Idempotent by documentId — sharing an already-public document returns the existing shareUrl."
    replay:
      idempotency_key: [documentId]
      stored_result: shareUrl
    transports: [stdio, streamable-http]

  - id: unshare_document
    input_schema:
      type: object
      properties:
        documentId:
          type: string
          minLength: 1
      required: [documentId]
    output_schema:
      type: object
      properties:
        documentId: { type: string }
        isPublic: { type: boolean, const: false }
      required: [documentId, isPublic]
    defaults: {}
    errors:
      - code: NOT_FOUND
        description: "Document ID does not exist"
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres unshare_document update failed"
    pagination: null
    side_effects: "UPDATES documents is_public=false and share_token=null via executePostgresMcpTool unshare_document (documents table)"
    idempotency: "Idempotent by documentId — unsharing an already-private document is a safe no-op."
    replay:
      idempotency_key: [documentId]
      stored_result: documentId
    transports: [stdio, streamable-http]

  - id: get_document
    input_schema:
      type: object
      properties:
        documentId:
          type: string
          minLength: 1
      required: [documentId]
    output_schema:
      type: object
      nullable: true
      description: "Document or null. Lookup by documentId (UUID) against the observed Postgres data plane."
    defaults: {}
    errors:
      - code: NOT_FOUND
        description: "Document does not exist — returns null"
      - code: RETIRED_DATA_PLANE
        description: "Observed cloud data plane is retired — carries retired_cloud_plane_removed_d08_02"
      - code: DATA_PLANE_READ_FAILED
        description: "Observed Postgres data-plane read failed — carries postgres_document_read_failed"
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres query failed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]

  - id: list_documents
    input_schema:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
        cursor:
          type: string
      required: []
    output_schema:
      type: object
      properties:
        documents:
          type: array
          items:
            type: object
        nextCursor:
          type: string
          nullable: true
        hasMore: { type: boolean }
    defaults:
      limit: 50
    errors:
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres query failed"
    pagination:
      type: cursor
      limit_default: 50
      limit_max: 1000
      ordering_field: _creationTime
      ordering_direction: desc
      cursor_field: cursor
      has_more_field: hasMore
      next_cursor_field: nextCursor
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]

  # ── Subscriptions ─────────────────────────────────────────────
  - id: add_subscription
    input_schema:
      type: object
      properties:
        sourceType:
          type: string
          enum: [youtube, newsletter, changelog, reddit, ebay, whats-new, github]
        identifier:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
        feedUrl:
          type: string
          format: uri
      required: [sourceType, identifier, name]
    output_schema:
      type: object
      properties:
        subscriptionId: { type: string }
        sourceType: { type: string }
        identifier: { type: string }
        name: { type: string }
        createdAt: { type: number }
    defaults: {}
    errors:
      - code: VALIDATION_ERROR
        description: "Missing required fields or invalid sourceType"
      - code: DUPLICATE_SUBSCRIPTION
        description: "Subscription with same sourceType + identifier already exists"
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres add_subscription insert failed"
    pagination: null
    side_effects: "INSERTS subscription_sources row via executePostgresMcpTool add_subscription (Postgres UPSERT by sourceType+identifier)"
    idempotency: "Semi-idempotent by (sourceType, identifier) — Postgres executor returns the existing subscription_sources row when the key matches."
    replay:
      idempotency_key: [sourceType, identifier]
      stored_result: subscriptionId
    transports: [stdio, streamable-http]

  - id: remove_subscription
    input_schema:
      type: object
      properties:
        subscriptionId:
          type: string
          minLength: 1
      required: [subscriptionId]
    output_schema:
      type: object
      properties:
        deleted: { type: boolean }
        subscription:
          type: object
          properties:
            _id: { type: string }
            sourceType: { type: string }
            identifier: { type: string }
            name: { type: string }
    defaults: {}
    errors:
      - code: NOT_FOUND
        description: "Subscription ID does not exist"
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres remove_subscription delete failed"
    pagination: null
    side_effects: "DELETES subscription_sources row via executePostgresMcpTool remove_subscription"
    idempotency: "Idempotent by subscriptionId — deleting an already-deleted subscription returns NOT_FOUND."
    replay:
      idempotency_key: [subscriptionId]
      stored_result: deleted
    transports: [stdio, streamable-http]

  - id: list_subscriptions
    input_schema:
      type: object
      properties:
        sourceType:
          type: string
          enum: [youtube, newsletter, changelog, reddit, ebay, whats-new]
        autoResearchOnly:
          type: boolean
        limit:
          type: integer
          minimum: 1
      required: []
    output_schema:
      type: object
      properties:
        subscriptions:
          type: array
          items:
            type: object
            properties:
              _id: { type: string }
              sourceType: { type: string }
              identifier: { type: string }
              name: { type: string }
              autoResearch: { type: boolean }
              lastChecked: { type: number }
              createdAt: { type: number }
    defaults:
      limit: 100
    errors:
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres query failed"
    pagination:
      type: limit-only
      limit_default: 100
      limit_max: 1000
      ordering_field: createdAt
      ordering_direction: desc
      cursor_field: null
      has_more_field: null
      next_cursor_field: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]

  - id: check_subscriptions
    input_schema:
      type: object
      properties:
        sourceType:
          type: string
          enum: [youtube, newsletter, changelog, reddit, ebay, whats-new]
      required: []
    output_schema:
      type: object
      properties:
        sourcesChecked: { type: integer }
        totalFetched: { type: integer }
        totalQueued: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              source: { type: string }
              error: { type: string }
    defaults:
      sourceType: null
    errors:
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres check_subscriptions query failed"
      - code: FETCH_ERROR
        description: "One or more source feeds failed to fetch (partial — errors array in response)"
    pagination: null
    side_effects: "READS subscription_sources count via executePostgresMcpTool check_subscriptions (Postgres executor path)"
    idempotency: "Not idempotent — re-running may create duplicate subscriptionContent rows for items that changed since last check."
    replay:
      idempotency_key: [sourceType]
      stored_result: totalQueued
    transports: [stdio, streamable-http]

  - id: get_subscription_content
    input_schema:
      type: object
      properties:
        subscriptionId:
          type: string
          minLength: 1
        researchStatus:
          type: string
          enum: [pending, queued, researched, skipped]
        limit:
          type: integer
          minimum: 1
      required: [subscriptionId]
    output_schema:
      type: object
      properties:
        content:
          type: array
          items:
            type: object
            properties:
              _id: { type: string }
              sourceId: { type: string }
              contentId: { type: string }
              title: { type: string }
              url: { type: string }
              researchStatus: { type: string }
              passedFilter: { type: boolean }
              filterReason: { type: string }
              discoveredAt: { type: number }
    defaults:
      limit: 100
    errors:
      - code: NOT_FOUND
        description: "Subscription ID does not exist"
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres query failed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]

  - id: set_subscription_filter
    input_schema:
      type: object
      properties:
        sourceId: { type: string }
        sourceType: { type: string }
        ruleName:
          type: string
          minLength: 1
        ruleType:
          type: string
          minLength: 1
        ruleValue: {}
        weight: { type: number }
      required: [ruleName, ruleType, ruleValue]
    output_schema:
      type: object
      properties:
        filterId: { type: string }
        ruleName: { type: string }
        ruleType: { type: string }
        ruleValue: {}
        weight: { type: number }
    defaults: {}
    errors:
      - code: VALIDATION_ERROR
        description: "Neither sourceId nor sourceType provided"
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres set_subscription_filter insert failed"
    pagination: null
    side_effects: "INSERTS subscription_filters row via executePostgresMcpTool set_subscription_filter"
    idempotency: "Idempotent by (sourceId|sourceType, ruleName) — same filter rule upserts the existing row."
    replay:
      idempotency_key: [sourceId, ruleName]
      stored_result: filterId
    transports: [stdio, streamable-http]

  - id: get_subscription_filters
    input_schema:
      type: object
      properties:
        subscriptionId: { type: string }
        sourceType: { type: string }
      required: []
    output_schema:
      type: object
      properties:
        filters:
          type: array
          items:
            type: object
            properties:
              _id: { type: string }
              sourceId: { type: string }
              sourceType: { type: string }
              ruleName: { type: string }
              ruleType: { type: string }
              ruleValue: {}
              weight: { type: number }
    defaults: {}
    errors:
      - code: INTERNAL_SERVER_ERROR
        description: "Postgres query failed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]

  # ── Toolbelt ──────────────────────────────────────────────────
  - id: store_tool
    input_schema:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description: { type: string }
        content: { type: string }
        sourceUrl:

      category: null
    errors:
      - code: INTERNAL_SERVER_ERROR
        description: "Convex hybridSearch action failed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]
    fixtures: null

  - id: get_tool
    input_schema:
      type: object
      properties:
        toolId:
          type: string
          minLength: 1

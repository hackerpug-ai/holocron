            properties:
              _id: { type: string }
              sourceType: { type: string }
              identifier: { type: string }
              name: { type: string }
              autoResearch: { type: boolean }
              lastChecked: { type: number }
              createdAt: { type: number }
    defaults:
      limit: 100
    errors:
      - code: INTERNAL_SERVER_ERROR
        description: "Convex query failed"
    pagination:
      type: limit-only
      limit_default: 100
      limit_max: 1000
      ordering_field: createdAt
      ordering_direction: desc
      cursor_field: null
      has_more_field: null
      next_cursor_field: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]
    fixtures: null

  - id: check_subscriptions
    input_schema:
      type: object
      properties:
        sourceType:
          type: string
          enum: [youtube, newsletter, changelog, reddit, ebay, whats-new]
      required: []
    output_schema:
      type: object
      properties:
        sourcesChecked: { type: integer }
        totalFetched: { type: integer }
        totalQueued: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              source: { type: string }
              error: { type: string }
    defaults:
      sourceType: null
    errors:
      - code: INTERNAL_SERVER_ERROR
        description: "Convex check action failed"
      - code: FETCH_ERROR
        description: "One or more source feeds failed to fetch (partial — errors array in response)"
    pagination: null
    side_effects: "READS external source feeds, INSERTS subscriptionContent rows, QUEUES discovered items for research (subscriptions/actions:check)"
    idempotency: "Not idempotent — re-running may create duplicate subscriptionContent rows for items that changed since last check."
    replay:
      idempotency_key: [sourceType]
      stored_result: totalQueued
    transports: [stdio, streamable-http]
    fixtures: null

  - id: get_subscription_content
    input_schema:
      type: object
      properties:
        subscriptionId:
          type: string
          minLength: 1
        researchStatus:
          type: string
          enum: [pending, queued, researched, skipped]
        limit:
          type: integer
          minimum: 1
      required: [subscriptionId]
    output_schema:
      type: object
      properties:
        content:
          type: array
          items:
            type: object
            properties:
              _id: { type: string }
              sourceId: { type: string }
              contentId: { type: string }
              title: { type: string }
              url: { type: string }
              researchStatus: { type: string }
              passedFilter: { type: boolean }
              filterReason: { type: string }
              discoveredAt: { type: number }
    defaults:
      limit: 100
    errors:
      - code: NOT_FOUND
        description: "Subscription ID does not exist"
      - code: INTERNAL_SERVER_ERROR
        description: "Convex query failed"
    pagination: null
    side_effects: null
    idempotency: null
    replay: null
    transports: [stdio, streamable-http]
    fixtures: null

  - id: set_subscription_filter
    input_schema:
      type: object
      properties:
        sourceId: { type: string }
        sourceType: { type: string }
        ruleName:
          type: string
          minLength: 1
        ruleType:
          type: string
          minLength: 1
        ruleValue: {}
        weight: { type: number }
      required: [ruleName, ruleType, ruleValue]
    output_schema:
      type: object
      properties:
        filterId: { type: string }
        ruleName: { type: string }
        ruleType: { type: string }
        ruleValue: {}
        weight: { type: number }
    defaults: {}
    errors:
      - code: VALIDATION_ERROR
        description: "Neither sourceId nor sourceType provided"
      - code: INTERNAL_SERVER_ERROR
        description: "Convex setFilter mutation failed"
    pagination: null
    side_effects: "UPSERTS subscriptionFilters row (subscriptions/mutations:setFilter)"
    idempotency: "Idempotent by (sourceId|sourceType, ruleName) — same filter rule upserts the existing row."
    replay:
      idempotency_key: [sourceId, ruleName]
      stored_result: filterId
    transports: [stdio, streamable-http]
    fixtures: null

  - id: get_subscription_filters
    input_schema:
      type: object
      properties:
        subscriptionId: { type: string }
        sourceType: { type: string }
      required: []
    output_schema:
      type: object
      properties:
        filters:
          type: array
          items:
            type: object
            properties:
              _id: { type: string }
              sourceId: { type: string }

# D02-05 — Fast lane: every push/PR commit (typecheck, lint, unit, actionlint)
name: ci-fast

# Deliberately unfiltered: tests/ and every other changed path run the fast lane.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run actionlint
        run: |
          set -euo pipefail
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  quality:
    name: typecheck lint unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.19"

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install platform dependencies
        working-directory: services/platform
        run: bun install

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck platform contract surface (mcp + tools)
        working-directory: services/platform
        run: bun run typecheck:contract

      - name: Lint
        run: pnpm lint

      - name: Pure unit tests
        run: pnpm test:unit -- --passWithNoTests

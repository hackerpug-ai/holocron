# Sprint 20 — real Maestro cold-boot reference-flow gate.
name: ci-e2e

on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: "Successful ci-e2e run ID to bind into the strict native human gate"
        required: false
        type: string
      evidence_tested_sha:
        description: "Source SHA tested by evidence_run_id"
        required: false
        type: string
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "scripts/e2e/**"
      - ".e2e/**"
      - ".github/workflows/ci-e2e.yml"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  fork-safety:
    name: reject fork e2e execution
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed for fork PR
        run: |
          echo "E2E secrets and self-hosted simulators are unavailable to fork PRs — fail closed" >&2
          exit 1

  e2e:
    name: Maestro cold-boot reference flow
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, holocron, e2e]
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.NONPROD_DATABASE_URL }}
      FLEET_URL: ${{ secrets.FLEET_URL }}
      PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
      EXPO_PUBLIC_PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
      EXPO_PUBLIC_RN_API_KEY: ${{ secrets.RN_API_KEY }}
      ZERO_ADMIN_PASSWORD: ${{ secrets.ZERO_ADMIN_PASSWORD }}
      ZERO_CVR_DB: ${{ secrets.NONPROD_DATABASE_URL }}
      ZERO_CHANGE_DB: ${{ secrets.NONPROD_DATABASE_URL }}
      MAESTRO_DEVICE: ${{ vars.MAESTRO_DEVICE }}
      EXPO_DEV_BUILD_PATH: ${{ vars.EXPO_DEV_BUILD_PATH }}
      MAESTRO_APP_ID: ${{ vars.MAESTRO_APP_ID }}
      EXPO_PUBLIC_REFERENCE_FLOW: "true"
      EXPO_PUBLIC_REFERENCE_CONVERSATION_ID: "00000000-0000-0000-0000-000000000020"
      EXPO_PUBLIC_ZERO_CACHE_URL: "http://127.0.0.1:4848"
      RUN_CAPSTONE_VERDICT: "true"
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/.tmp/maestro-reference-flow
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.19"

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install platform dependencies
        run: pnpm install --dir services/platform --frozen-lockfile

      - name: Provision pinned Rocicorp Litestream
        run: |
          set -euo pipefail

          litestream_root="${RUNNER_TEMP}/rocicorp-litestream-v0.3.13-${GITHUB_RUN_ID}"
          litestream_bin_dir="${RUNNER_TEMP}/rocicorp-litestream-bin-${GITHUB_RUN_ID}"
          litestream_executable="${litestream_bin_dir}/litestream"
          litestream_backup_dir="${RUNNER_TEMP}/zero-cache-litestream-backup-${GITHUB_RUN_ID}"

          git clone --depth 1 --branch v0.3.13 \
            https://github.com/rocicorp/litestream.git "$litestream_root"
          test "$(git -C "$litestream_root" rev-parse HEAD)" = \
            977d4a5ee45ae546537324a3cfbf926de3bebc97
          mkdir -p "$litestream_bin_dir" "$litestream_backup_dir"
          (
            cd "$litestream_root"
            go build -trimpath -ldflags '-X main.Version=v0.3.13' \
              -o "$litestream_executable" ./cmd/litestream
          )
          test -x "$litestream_executable"
          test -n "$($litestream_executable version)"

          {
            printf 'ZERO_LITESTREAM_EXECUTABLE=%s\n' "$litestream_executable"
            printf 'ZERO_LITESTREAM_BACKUP_URL=file://%s\n' "$litestream_backup_dir"
            printf 'ZERO_LITESTREAM_CONFIG=%s/scripts/e2e/zero-cache-litestream.yml\n' "$GITHUB_WORKSPACE"
          } >>"$GITHUB_ENV"

      - name: Fail-closed runner contract
        run: |
          set -euo pipefail

          if [[ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ]]; then
            echo "E2E requires a self-hosted runner (RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-unset})" >&2
            exit 1
          fi
          if [[ "${RUNNER_OS:-}" != "macOS" ]]; then
            echo "E2E requires macOS (RUNNER_OS=${RUNNER_OS:-unset})" >&2
            exit 1
          fi
          if [[ -z "${RUNNER_NAME:-}" ]]; then
            echo "E2E requires a non-empty RUNNER_NAME" >&2
            exit 1
          fi

          status_file="$(mktemp "${RUNNER_TEMP:-/tmp}/holocron-runner-status.XXXXXX")"
          trap 'rm -f "$status_file"' EXIT

          # Runtime attestation of this job's already-selected runs-on labels;
          # this file is temporary and is never committed as CI evidence.
          RUNNER_STATUS_FILE="$status_file" bun -e '
            const statusFile = process.env.RUNNER_STATUS_FILE;
            const runnerName = process.env.RUNNER_NAME;
            if (!statusFile || !runnerName) {
              throw new Error("runner status file or RUNNER_NAME is missing");
            }
            await Bun.write(statusFile, `${JSON.stringify({
              online: true,
              runners: [{
                name: runnerName,
                status: "online",
                labels: ["self-hosted", "holocron", "e2e"],
              }],
            })}\n`);
          '

          # The status file is authoritative for this already-dispatched job.
          # Remove API credentials so holo cannot fall back to the forbidden runners API.
          env -u GITHUB_TOKEN -u GH_TOKEN -u GITHUB_REPOSITORY \
            HOLO_RUNNER_STATUS_FILE="$status_file" \
            bun services/platform/src/cli/holo.ts ci runner:status --json --lane e2e

      - name: Check real device, build, and backend prerequisites
        run: scripts/e2e/run-maestro-reference-flow.sh --check

      - name: Start reference Metro with CI runtime endpoints
        run: |
          set -euo pipefail

          metro_log="${RUNNER_TEMP}/holocron-reference-metro-${GITHUB_RUN_ID}.log"
          existing_pid="$(lsof -nP -tiTCP:8081 -sTCP:LISTEN 2>/dev/null | head -1 || true)"
          if [[ -n "$existing_pid" ]]; then
            existing_command="$(ps -p "$existing_pid" -o command= || true)"
            existing_cwd="$(lsof -a -p "$existing_pid" -d cwd -Fn 2>/dev/null | sed -n 's/^n//p' | head -1 || true)"
            if [[ "$existing_command" != *"expo start"* || "$existing_cwd" != *"holocron"* ]]; then
              echo "port 8081 is occupied by a non-Holocron Expo process; refusing to terminate it" >&2
              exit 1
            fi
            echo "stopping existing Holocron Metro process ${existing_pid} (${existing_cwd})"
            kill "$existing_pid"
            for _ in {1..20}; do
              if ! kill -0 "$existing_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$existing_pid" 2>/dev/null; then
              echo "existing Expo Metro process did not stop on port 8081" >&2
              exit 1
            fi
          fi

          EXPO_PUBLIC_PLATFORM_URL="${EXPO_PUBLIC_PLATFORM_URL}" \
          EXPO_PUBLIC_ZERO_CACHE_URL="http://127.0.0.1:4848" \
          EXPO_PUBLIC_RN_API_KEY="${EXPO_PUBLIC_RN_API_KEY}" \
          EXPO_PUBLIC_REFERENCE_FLOW="true" \
          EXPO_PUBLIC_REFERENCE_CONVERSATION_ID="${EXPO_PUBLIC_REFERENCE_CONVERSATION_ID}" \
          CI=1 pnpm exec expo start --dev-client --lan --port 8081 \
            >"$metro_log" 2>&1 &
          metro_pid=$!
          printf 'E2E_METRO_PID=%s\n' "$metro_pid" >>"$GITHUB_ENV"
          printf 'E2E_METRO_LOG=%s\n' "$metro_log" >>"$GITHUB_ENV"

          for _ in {1..30}; do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8081/status >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$metro_pid" 2>/dev/null; then
              cat "$metro_log" >&2 || true
              exit 1
            fi
            sleep 1
          done
          cat "$metro_log" >&2 || true
          echo "reference Metro did not become ready on port 8081" >&2
          exit 1

      - name: Run cold-boot reference flow
        run: scripts/e2e/run-maestro-reference-flow.sh --run

      - name: Verify harness fail-closed suite
        run: |
          set +e
          PLATFORM_IT=1 pnpm exec vitest run tests/integration/sprint20-maestro-harness.test.ts
          suite_rc=$?
          set -e
          jq -n --argjson exitCode "$suite_rc" '{exitCode:$exitCode}' \
            >.tmp/maestro-reference-flow/step5-harness-suite.json
          exit "$suite_rc"

      - name: Verify missing Expo build fails closed
        run: |
          negative_dir="${{ github.workspace }}/.tmp/maestro-reference-flow-negative"
          set +e
          E2E_ARTIFACT_DIR="$negative_dir" EXPO_DEV_BUILD_PATH= \
            scripts/e2e/run-maestro-reference-flow.sh --run \
            >.tmp/maestro-reference-flow/step5-missing-build.log 2>&1
          missing_build_rc=$?
          set -e
          test "$missing_build_rc" -eq 1
          test ! -e "$negative_dir/junit.xml"
          jq -n \
            --argjson exitCode "$missing_build_rc" \
            --arg log ".tmp/maestro-reference-flow/step5-missing-build.log" \
            --arg artifact_dir "$negative_dir" \
            '{exitCode:$exitCode,junit_present:false,log:$log,artifact_dir:$artifact_dir}' \
            >.tmp/maestro-reference-flow/step5-missing-build-run.json

      - name: Stop reference Metro
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -n "${E2E_METRO_PID:-}" ]] && kill -0 "$E2E_METRO_PID" 2>/dev/null; then
            kill "$E2E_METRO_PID" 2>/dev/null || true
          fi
          if [[ -n "${E2E_METRO_LOG:-}" && -f "$E2E_METRO_LOG" ]]; then
            tail -80 "$E2E_METRO_LOG" || true
          fi

      - name: Upload Maestro artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-reference-flow-${{ github.run_id }}
          path: .tmp/maestro-reference-flow/
          if-no-files-found: error

  native-human-gate:
    name: Six-step native human gate
    needs: e2e
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence_run_id != '' && inputs.evidence_tested_sha != '' }}
    runs-on: [self-hosted, holocron, e2e]
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    env:
      DATABASE_URL: ${{ secrets.NONPROD_DATABASE_URL }}
      FLEET_URL: ${{ secrets.FLEET_URL }}
      PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
      EXPO_PUBLIC_PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
      EXPO_PUBLIC_RN_API_KEY: ${{ secrets.RN_API_KEY }}
      ZERO_ADMIN_PASSWORD: ${{ secrets.ZERO_ADMIN_PASSWORD }}
      ZERO_CVR_DB: ${{ secrets.NONPROD_DATABASE_URL }}
      ZERO_CHANGE_DB: ${{ secrets.NONPROD_DATABASE_URL }}
      MAESTRO_DEVICE: ${{ vars.MAESTRO_DEVICE }}
      EXPO_DEV_BUILD_PATH: ${{ vars.EXPO_DEV_BUILD_PATH }}
      MAESTRO_APP_ID: ${{ vars.MAESTRO_APP_ID }}
      EXPO_PUBLIC_REFERENCE_FLOW: "true"
      EXPO_PUBLIC_REFERENCE_CONVERSATION_ID: "00000000-0000-0000-0000-000000000020"
      EXPO_PUBLIC_ZERO_CACHE_URL: "http://127.0.0.1:4848"
      EXPECTED_TESTED_SHA: ${{ inputs.evidence_tested_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.19"

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install platform dependencies
        run: pnpm install --dir services/platform --frozen-lockfile

      - name: Provision pinned Rocicorp Litestream
        run: |
          set -euo pipefail
          litestream_root="${RUNNER_TEMP}/native-gate-litestream-${GITHUB_RUN_ID}"
          litestream_bin_dir="${RUNNER_TEMP}/native-gate-litestream-bin-${GITHUB_RUN_ID}"
          litestream_executable="${litestream_bin_dir}/litestream"
          litestream_backup_dir="${RUNNER_TEMP}/native-gate-litestream-backup-${GITHUB_RUN_ID}"
          git clone --depth 1 --branch v0.3.13 https://github.com/rocicorp/litestream.git "$litestream_root"
          test "$(git -C "$litestream_root" rev-parse HEAD)" = 977d4a5ee45ae546537324a3cfbf926de3bebc97
          mkdir -p "$litestream_bin_dir" "$litestream_backup_dir"
          (cd "$litestream_root" && go build -trimpath -ldflags '-X main.Version=v0.3.13' -o "$litestream_executable" ./cmd/litestream)
          {
            printf 'ZERO_LITESTREAM_EXECUTABLE=%s\n' "$litestream_executable"
            printf 'ZERO_LITESTREAM_BACKUP_URL=file://%s\n' "$litestream_backup_dir"
            printf 'ZERO_LITESTREAM_CONFIG=%s/scripts/e2e/zero-cache-litestream.yml\n' "$GITHUB_WORKSPACE"
          } >>"$GITHUB_ENV"

      - name: Capture exact successful CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/e2e/capture-ci-provenance.sh \
            --run-id "${{ inputs.evidence_run_id }}" \
            --expected-sha "${{ inputs.evidence_tested_sha }}" \
            --download-dir .tmp/native-gate-ci-artifact

      - name: Start reference Metro
        run: |
          set -euo pipefail
          metro_log="${RUNNER_TEMP}/native-gate-metro-${GITHUB_RUN_ID}.log"
          existing_pid="$(lsof -nP -tiTCP:8081 -sTCP:LISTEN 2>/dev/null | head -1 || true)"
          if [[ -n "$existing_pid" ]]; then
            existing_command="$(ps -p "$existing_pid" -o command= || true)"
            existing_cwd="$(lsof -a -p "$existing_pid" -d cwd -Fn 2>/dev/null | sed -n 's/^n//p' | head -1 || true)"
            [[ "$existing_command" == *"expo start"* && "$existing_cwd" == *"holocron"* ]] || exit 1
            kill "$existing_pid"
          fi
          EXPO_PUBLIC_PLATFORM_URL="${EXPO_PUBLIC_PLATFORM_URL}" \
          EXPO_PUBLIC_ZERO_CACHE_URL="http://127.0.0.1:4848" \
          EXPO_PUBLIC_RN_API_KEY="${EXPO_PUBLIC_RN_API_KEY}" \
          EXPO_PUBLIC_REFERENCE_FLOW="true" \
          EXPO_PUBLIC_REFERENCE_CONVERSATION_ID="${EXPO_PUBLIC_REFERENCE_CONVERSATION_ID}" \
          CI=1 pnpm exec expo start --dev-client --lan --port 8081 >"$metro_log" 2>&1 &
          metro_pid=$!
          printf 'NATIVE_GATE_METRO_PID=%s\n' "$metro_pid" >>"$GITHUB_ENV"
          for _ in {1..30}; do
            curl --silent --fail --max-time 2 http://127.0.0.1:8081/status >/dev/null && exit 0
            kill -0 "$metro_pid" 2>/dev/null || { cat "$metro_log" >&2; exit 1; }
            sleep 1
          done
          cat "$metro_log" >&2
          exit 1

      - name: Run strict six-step native human gate
        run: |
          scripts/e2e/run-sprint20-native-human-gate.sh --run \
            --ci-artifact-dir .tmp/native-gate-ci-artifact \
            --run-id "gha-${GITHUB_RUN_ID}"

      - name: Stop reference Metro
        if: ${{ always() }}
        run: |
          if [[ -n "${NATIVE_GATE_METRO_PID:-}" ]] && kill -0 "$NATIVE_GATE_METRO_PID" 2>/dev/null; then
            kill "$NATIVE_GATE_METRO_PID" 2>/dev/null || true
          fi

      - name: Upload native gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sprint20-native-human-gate-${{ github.run_id }}
          path: |
            .spec/prds/mk6-migration/tasks/sprint-20-e2e-maestro-harness-and-cold-boot-reference-flow/gate-results.json
            .spec/prds/mk6-migration/tasks/sprint-20-e2e-maestro-harness-and-cold-boot-reference-flow/gate-verification.json
            .spec/prds/mk6-migration/tasks/sprint-20-e2e-maestro-harness-and-cold-boot-reference-flow/.gate-evidence/
          if-no-files-found: error

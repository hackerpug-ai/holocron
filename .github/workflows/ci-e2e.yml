# Sprint 20 — real Maestro cold-boot reference-flow gate.
name: ci-e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "scripts/e2e/**"
      - ".e2e/**"
      - ".github/workflows/ci-e2e.yml"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  fork-safety:
    name: reject fork e2e execution
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed for fork PR
        run: |
          echo "E2E secrets and self-hosted simulators are unavailable to fork PRs — fail closed" >&2
          exit 1

  e2e:
    name: Maestro cold-boot reference flow
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, holocron, e2e]
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.NONPROD_DATABASE_URL }}
      FLEET_URL: ${{ secrets.FLEET_URL }}
      PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
      EXPO_PUBLIC_PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
      ZERO_ADMIN_PASSWORD: ${{ secrets.ZERO_ADMIN_PASSWORD }}
      ZERO_CVR_DB: ${{ secrets.NONPROD_DATABASE_URL }}
      ZERO_CHANGE_DB: ${{ secrets.NONPROD_DATABASE_URL }}
      MAESTRO_DEVICE: ${{ vars.MAESTRO_DEVICE }}
      EXPO_DEV_BUILD_PATH: ${{ vars.EXPO_DEV_BUILD_PATH }}
      MAESTRO_APP_ID: ${{ vars.MAESTRO_APP_ID }}
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/.tmp/maestro-reference-flow
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.19"

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail-closed runner contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun services/platform/src/cli/holo.ts ci runner:status --json

      - name: Check real device, build, and backend prerequisites
        run: scripts/e2e/run-maestro-reference-flow.sh --check

      - name: Run cold-boot reference flow
        run: scripts/e2e/run-maestro-reference-flow.sh --run

      - name: Upload Maestro artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-reference-flow-${{ github.run_id }}
          path: .tmp/maestro-reference-flow/
          if-no-files-found: error

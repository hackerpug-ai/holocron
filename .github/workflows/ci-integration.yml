# D02-05 — Integration lane: pre-merge real Postgres + fleet on self-hosted labels
name: ci-integration

on:
  pull_request:
    paths:
      - "services/platform/**"
      - "tests/**"
      - ".github/workflows/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vitest.config.ts"
      - "docs/ci/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Never execute untrusted fork code on the persistent self-hosted runner.
  fork-safety:
    name: reject fork integration execution
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed for fork PR
        run: |
          echo "Integration secrets and self-hosted runners are unavailable to fork PRs — fail closed" >&2
          exit 1

  integration:
    name: real-service integration (fail-closed)
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, holocron, integration]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.19"

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install platform dependencies
        working-directory: services/platform
        run: bun install

      - name: Fail-closed runner label contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bun services/platform/src/cli/holo.ts ci runner:status --json

      - name: Provision + seed nonprod namespace
        env:
          DATABASE_URL: ${{ secrets.NONPROD_DATABASE_URL }}
          HOLO_ALLOW_PROD_SEED: "0"
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "NONPROD_DATABASE_URL secret missing — fail closed" >&2
            exit 1
          fi
          case "$DATABASE_URL" in
            *holocron_nonprod*) ;;
            *)
              echo "DATABASE_URL must target holocron_nonprod — fail closed" >&2
              exit 1
              ;;
          esac
          bun services/platform/src/cli/holo.ts db seed --reset --json

      - name: PRD consistency gate
        run: bun services/platform/src/cli/holo.ts prd:consistency --json

      - name: Real-service integration suite
        env:
          DATABASE_URL: ${{ secrets.NONPROD_DATABASE_URL }}
          FLEET_URL: ${{ secrets.FLEET_URL }}
          PLATFORM_IT: "1"
        run: |
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${FLEET_URL:-}" ]; then
            echo "NONPROD_DATABASE_URL and FLEET_URL required — fail closed (no mocks)" >&2
            exit 1
          fi
          pnpm test:integration

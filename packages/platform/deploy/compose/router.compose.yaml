# Auxiliary Holocron LiteLLM router contract (S33-OPS-02).
# Keep this beside compose.yaml: the production platform contract remains the
# four services declared there. The router is a separately managed dependency.
name: holocron-router

x-holocron-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  litellm-router:
    image: ghcr.io/berriai/litellm@sha256:468c25f35f3e5ec4e414974f00deab93337b1b4d9953cabcfd3722e59415f834
    restart: unless-stopped
    logging: *bounded-logging
    ports:
      - "0.0.0.0:4545:4545"
    configs:
      - source: router-config
        target: /etc/litellm/config.yaml
        mode: 0444
    command:
      - --config
      - /etc/litellm/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "4545"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:4545/health/liveliness', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

configs:
  router-config:
    content: |
      model_list:
        # reviewer (convergent/judge) — Qwen3.8-27B-8bit on both minis (Fulcrum set
        # adopted per operator decision 2026-08-29). No laptop fallback.
        - model_name: reviewer
          litellm_params:
            model: openai/Qwen3.8-27B-8bit
            api_base: http://inference1.tail011a51.ts.net:8003/v1
            api_key: sk-none
            weight: 100
        - model_name: reviewer
          litellm_params:
            model: openai/Qwen3.8-27B-8bit
            api_base: http://inference2.tail011a51.ts.net:8003/v1
            api_key: sk-none
            weight: 100
        - model_name: implementer
          litellm_params:
            model: openai/Qwen3.8-27B-8bit
            api_base: http://inference1.tail011a51.ts.net:8003/v1
            api_key: sk-none
            weight: 100
        - model_name: implementer
          litellm_params:
            model: openai/Qwen3.8-27B-8bit
            api_base: http://inference2.tail011a51.ts.net:8003/v1
            api_key: sk-none
            weight: 100
        # Embed is Qwen3-Embedding-0.6B on inference1 + inference2 oMLX (farm role qwen3-embedding).
        - model_name: qwen3-embedding
          litellm_params:
            model: openai/Qwen3-Embedding-0.6B-4bit-DWQ
            api_base: http://inference1.tail011a51.ts.net:8003/v1
            api_key: sk-none
            weight: 100
        - model_name: qwen3-embedding
          litellm_params:
            model: openai/Qwen3-Embedding-0.6B-4bit-DWQ
            api_base: http://inference2.tail011a51.ts.net:8003/v1
            api_key: sk-none
            weight: 100
        # research (synthesis role) — Qwen3.8-27B-8bit on both minis (Fulcrum set
        # adopted per operator decision 2026-08-29). No laptop fallback.
        - model_name: research
          litellm_params:
            model: openai/Qwen3.8-27B-8bit
            api_base: http://inference1.tail011a51.ts.net:8003/v1
            api_key: sk-none
            weight: 100
        - model_name: research
          litellm_params:
            model: openai/Qwen3.8-27B-8bit
            api_base: http://inference2.tail011a51.ts.net:8003/v1
            api_key: sk-none
            weight: 100
        # qwen3-reranker route removed - minis do not expose rerank model
      router_settings:
        routing_strategy: least-busy
        num_retries: 2
        timeout: 600
        cooldown_time: 60
        # NOTE: qwen3-reranker route removed — no node loads reranker weights.
        # Rerank is INTENTIONALLY-DEGRADED-NO-MODEL (fail-closed) per fleet manifest;
        # follow-up: load BAAI-bge-reranker-v2-m3-mlx-fp16 on a mini to restore it.

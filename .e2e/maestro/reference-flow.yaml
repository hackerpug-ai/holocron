appId: ${MAESTRO_APP_ID}
---
# Sprint 20 proven-reference-flow. The app must expose these stable testIDs.
- launchApp:
    clearState: true
- assertVisible:
    id: chat-screen
- tapOn:
    id: chat-input-field
- inputText: "Sprint 20 reference-flow ping"
- tapOn:
    id: chat-input-send-button
- extendedWaitUntil:
    visible:
      id: chat-assistant-message
    timeout: 90000
- takeScreenshot: reference-chat-reply

pre-commit:
  parallel: true
  commands:
    root-lint:
      glob: "*.{ts,tsx,js,jsx,json}"
      run: pnpm biome check --write --no-errors-on-unmatched --diagnostic-level=error {staged_files}
    root-typecheck:
      run: pnpm tsgo --noEmit
    root-test:
      run: pnpm test:unit
    mcp-lint:
      glob: "packages/mcp/**/*.{ts,js,json}"
      root: packages/mcp
      run: pnpm biome check --write --no-errors-on-unmatched --diagnostic-level=error {staged_files}

name: holocron-router
services:
  litellm-router:
    command:
      - --config
      - /etc/litellm/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "4545"
    configs:
      - source: router-config
        target: /etc/litellm/config.yaml
        mode: "0444"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4545/health/liveliness',
          timeout=3)
      timeout: 5s
      interval: 10s
      retries: 6
      start_period: 20s
    image: ghcr.io/berriai/litellm@sha256:468c25f35f3e5ec4e414974f00deab93337b1b4d9953cabcfd3722e59415f834
    logging:
      driver: local
      options:
        max-file: "3"
        max-size: 10m
    networks:
      default: null
    ports:
      - mode: ingress
        host_ip: 0.0.0.0
        target: 4545
        published: "4545"
        protocol: tcp
    restart: unless-stopped
networks:
  default:
    name: holocron-router_default
configs:
  router-config:
    name: holocron-router_router-config
    content: |
      model_list:
        - model_name: reviewer
          litellm_params:
            model: openai/Qwen3.8-27B-8bit
            api_base: http://inference2.tail011a51.ts.net:8003/v1
            api_key: sk-none
        - model_name: implementer
          litellm_params:
            model: openai/Qwen3.6-35B-A3B-MLX-8bit
            api_base: http://inference1.tail011a51.ts.net:8003/v1
            api_key: sk-none
            weight: 100
        - model_name: implementer
          litellm_params:
            model: openai/Qwen3.6-35B-A3B-MLX-8bit
            api_base: http://inference2.tail011a51.ts.net:8003/v1
            api_key: sk-none
            weight: 100
      router_settings:
        routing_strategy: least-busy
        num_retries: 2
        timeout: 600
        cooldown_time: 60
x-holocron-logging:
  driver: local
  options:
    max-file: "3"
    max-size: 10m

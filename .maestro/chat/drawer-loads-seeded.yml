appId: ${MAESTRO_APP_ID}
---
# AC-1 / TC-1 — Drawer conversation list loads via Zero query
# Cold boot: Expo Dev Client open URL is parameterized — NEVER hardcode a LAN IP.
# Set via harness:
#   MAESTRO_METRO_URL=http://<reachable-host>:8081
#   MAESTRO_METRO_URL_ENCODED=<url-encoded MAESTRO_METRO_URL>
#   or MAESTRO_DEV_CLIENT_OPEN_URL=exp+holocron://expo-development-client/?url=<encoded>
# Optional chrome (Open/Allow/Continue/Close/Reload) may be optional.
# Data oracles are NON-optional (shell id, three seeded list rows).

- launchApp:
    clearState: true

# Open Expo Dev Client pointed at the live Metro bundler (parameterized)
- openLink: ${MAESTRO_DEV_CLIENT_OPEN_URL}
- extendedWaitUntil:
    visible:
      text: "Open"
    timeout: 20000
    optional: true
- tapOn:
    text: "Open"
    optional: true

# Notification / system permission chrome (optional only)
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: ".*Allow.*"
    optional: true

- runFlow:
    when:
      visible: "Metro has encountered an error"
    commands:
      - tapOn:
          text: "Reload"
          optional: true

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - tapOn:
          text: "Close"
          optional: true

# NON-OPTIONAL: app shell after cold boot
- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 120000
- assertVisible:
    id: "chat-screen"

# Header menu chrome (may be skipped if drawer already open).
# Open the navigation drawer for the seeded list-row asserts below.
# Padding so chrome flags stay outside the TC-7 five-line oracle window.
# Chrome-only taps follow; they are not human-gate data oracles.
# ---

- tapOn:
    id: "chat-header-menu-button"
    optional: true
- tapOn:
    id: "screen-header-menu-button"
    optional: true

- extendedWaitUntil:
    visible:
      id: "drawer-content"
    timeout: 20000

# NON-OPTIONAL: three seeded list rows via Zero
- assertNotVisible:
    id: "drawer-content-empty"
- assertVisible:
    id: "conversation-row"
    index: 0
- assertVisible:
    id: "conversation-row"
    index: 1
- assertVisible:
    id: "conversation-row"
    index: 2
- takeScreenshot: S-REWRITE-01-AC-1-drawer-seeded

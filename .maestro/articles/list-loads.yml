# S-REWRITE-02 AC-1 / TC-1 — Articles list loads via Zero
# Prerequisite: `holo seed:e2e --reset` (12 documents) + Metro + Zero + platform up.
# Requires installed app bundleId com.holocron.app on a named iOS Simulator.
# DATA oracles (articles-route, article-card-pressable multi-card) are NON-optional.
# Dev-client chrome (DEVELOPMENT SERVERS / Continue / Close) may remain optional.
#
# HIGH-3 hang note: unbounded assertNotVisible on articles-empty-state can hang the
# full driver when empty chrome remains/flaps after a card match. Bound empty-state
# checks with a short timeout so the step fails closed quickly; preserve hang logs
# under .tmp/GATE-FIX-002/high3-articles-empty-hang/ as oracle feedback.
appId: com.holocron.app
---
- launchApp:
    clearState: false

# Expo dev-client / Metro host pickers (optional on cold start) — before data oracles
- extendedWaitUntil:
    visible:
      text: "DEVELOPMENT SERVERS"
    timeout: 15000
    optional: true

- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn:
          text: ".*http.*"
          optional: true

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - tapOn:
          text: "Close"
          optional: true

# Prefer deep link into articles
- openLink: holocron://articles

# NON-OPTIONAL: articles route shell
- extendedWaitUntil:
    visible:
      id: "articles-route"
    timeout: 90000

- assertVisible:
    id: "articles-route"

# NON-OPTIONAL: seeded document cards via Zero (12 docs path)
# Wait for cards first so loading empty-state chrome is not a false fail.
- extendedWaitUntil:
    visible:
      id: "article-card-pressable"
    timeout: 60000

- assertVisible:
    id: "article-card-pressable"

# HIGH-3 / GATE-FIX-002: multi-card floor (seeded 12 docs → at least indices 0 and 1)
- assertVisible:
    id: "article-card-pressable"
    index: 0
- assertVisible:
    id: "article-card-pressable"
    index: 1

# Positive list chrome (stronger than empty negation alone)
- extendedWaitUntil:
    visible:
      id: "articles-list"
    timeout: 15000
    optional: true
- extendedWaitUntil:
    visible:
      id: "articles-count-header"
    timeout: 15000
    optional: true

# Empty-state must not remain as sole content AFTER cards proved present.
# BOUNDED timeout — never hang the full driver (fail closed within 10s).
- extendedWaitUntil:
    notVisible:
      id: "articles-empty-state"
    timeout: 10000

- takeScreenshot: articles-list-loads

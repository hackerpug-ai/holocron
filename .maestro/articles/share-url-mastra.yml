# S-REWRITE-02 AC-3 / TC-3 — Share URL points to Mastra /article/ host
# Prerequisite: seeded public (or publishable) document + Metro + Zero + platform up.
# Requires installed app bundleId com.holocron.app on a named iOS Simulator.
# Oracle: after Share, system share sheet / link text must contain `/article/`
# and must not contain `.convex.site` / `.convex.cloud`.
#
# Probe2 /tmp/share-probe2-final.png: collapsed Expo Dev Menu gear FAB at top-right
# (not "Runtime version" text). "Runtime version" condition misses that state.
# Clear overlay before share: tap gear area (~90%,14%) → dismiss expanded menu
# (X/Close) → SINGLE-tap document-actions-button → assert sheet-share.
# Unconditional second actions-button tap is forbidden.
appId: com.holocron.app
---
- launchApp:
    clearState: false

# Bounded optional: expanded Dev Menu left open from a prior step
- runFlow:
    when:
      visible: "Runtime version"
    commands:
      - tapOn:
          id: "xmark"
          optional: true
      - tapOn:
          text: "Close"
          optional: true
      - tapOn:
          point: "50%,12%"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000

- openLink: holocron://articles

- extendedWaitUntil:
    visible:
      id: "article-card-pressable"
    timeout: 90000

- tapOn:
    id: "article-card-pressable"
    index: 0

- extendedWaitUntil:
    visible:
      id: "document-layout"
    timeout: 60000

# --- Clear Expo floating gear overlay (collapsed state has no "Runtime version") ---
# probe2-final: gear sits on top-right over document-actions-button.
# Tap expands menu; then dismiss so our ellipsis is free for a real single tap.
- tapOn:
    point: "90%,14%"
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible: "Runtime version"
    commands:
      - tapOn:
          id: "xmark"
          optional: true
      - tapOn:
          text: "Close"
          optional: true
      - tapOn:
          text: ".*Close.*"
          optional: true
      - tapOn:
          point: "50%,12%"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
# If expanded menu still present (xmark id path), one more dismiss pass
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn:
          id: "xmark"
          optional: true
      - tapOn:
          text: "Close"
          optional: true
      - tapOn:
          point: "50%,12%"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000

# If gear-area tap accidentally opened our sheet, skip re-open; else single-tap.
- runFlow:
    when:
      notVisible:
        id: "document-actions-sheet-share"
    commands:
      - extendedWaitUntil:
          visible:
            id: "document-actions-button"
          timeout: 30000
      - tapOn:
          id: "document-actions-button"

# Sheet content (Pressable share)
- extendedWaitUntil:
    visible:
      id: "document-actions-sheet-share"
    timeout: 20000

- assertVisible:
    id: "document-actions-sheet-share"

- tapOn:
    id: "document-actions-sheet-share"

# Legacy ActionSheet branch (optional; direct Share.share is preferred)
- tapOn:
    text: "Share Link"
    optional: true

# System share sheet may open and hide app hierarchy. Dismiss it so the
# in-app document-share-url oracle (full /article/ path) is queryable.
- runFlow:
    when:
      visible: "Copy"
    commands:
      - tapOn:
          point: "50%,8%"
- runFlow:
    when:
      visible: "Reminders"
    commands:
      - tapOn:
          point: "50%,8%"
- tapOn:
    text: "Close"
    optional: true

# GATE-FIX-007b: full URL is mounted as document-share-url (iOS share sheet
# accessibility only shows host like 127.0.0.1, not /article/ path).
- extendedWaitUntil:
    visible:
      id: "document-share-url"
    timeout: 20000

- assertVisible:
    id: "document-share-url"

- assertVisible:
    text: ".*(/article/).*"

# MUST NOT observe legacy Convex host rewrite
- assertNotVisible:
    text: ".*\\.convex\\.site.*"
- assertNotVisible:
    text: ".*\\.convex\\.cloud.*"

- takeScreenshot: articles-share-url-mastra

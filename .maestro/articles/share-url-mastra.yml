# S-REWRITE-02 AC-3 / TC-3 — Share URL points to Mastra /article/ host
# Prerequisite: seeded public (or publishable) document + Metro + Zero + platform up.
# Requires installed app bundleId com.holocron.app on a named iOS Simulator.
# Oracle: after Share, system share sheet / link text must contain `/article/`
# and must not contain `.convex.site` / `.convex.cloud`.
#
# GATE-FIX-007: Expo Dev Client gear FAB sits on top of the header ellipsis
# (document-actions-button). Driver disables FAB via UserDefaults before this
# flow. Single tap only — double-tap opened Dev Menu / hid the button.
# All seeded public docs carry share_token so publish is not required.
appId: com.holocron.app
---
- launchApp:
    clearState: false

# Dismiss Expo Dev Menu if left open from a prior failed tap
- runFlow:
    when:
      visible: "Runtime version"
    commands:
      - tapOn:
          id: "xmark"
          optional: true
      - tapOn:
          text: "Close"
          optional: true
      - tapOn:
          point: "50%,15%"

- openLink: holocron://articles

- extendedWaitUntil:
    visible:
      id: "article-card-pressable"
    timeout: 90000

- tapOn:
    id: "article-card-pressable"
    index: 0

# Ensure document detail mounted before header actions
- extendedWaitUntil:
    visible:
      id: "document-layout"
    timeout: 60000

- extendedWaitUntil:
    visible:
      id: "document-actions-button"
    timeout: 30000

# Open actions sheet. NEVER unconditional double-tap:
# qa-real-7step-stable-dd83a798-20260724T061012Z — first tap opened the sheet
# (button leaves hierarchy); second hard tap failed "element not found".
# Retry only when share row still not visible; second tap is optional.
- tapOn:
    id: "document-actions-button"
- runFlow:
    when:
      notVisible:
        id: "document-actions-sheet-share"
    commands:
      - tapOn:
          id: "document-actions-button"
          optional: true

# Sheet content (Pressable share) — simplified Modal+View hierarchy
- extendedWaitUntil:
    visible:
      id: "document-actions-sheet-share"
    timeout: 20000

- assertVisible:
    id: "document-actions-sheet-share"

- tapOn:
    id: "document-actions-sheet-share"

# Legacy ActionSheet branch (optional; direct Share.share is preferred)
- tapOn:
    text: "Share Link"
    optional: true

# System share sheet may open and hide app hierarchy. Dismiss it so the
# in-app document-share-url oracle (full /article/ path) is queryable.
- runFlow:
    when:
      visible: "Copy"
    commands:
      - tapOn:
          point: "50%,8%"
- runFlow:
    when:
      visible: "Reminders"
    commands:
      - tapOn:
          point: "50%,8%"
- tapOn:
    text: "Close"
    optional: true

# GATE-FIX-007b: full URL is mounted as document-share-url (iOS share sheet
# accessibility only shows host like 127.0.0.1, not /article/ path).
- extendedWaitUntil:
    visible:
      id: "document-share-url"
    timeout: 20000

- assertVisible:
    id: "document-share-url"

- assertVisible:
    text: ".*(/article/).*"

# MUST NOT observe legacy Convex host rewrite
- assertNotVisible:
    text: ".*\\.convex\\.site.*"
- assertNotVisible:
    text: ".*\\.convex\\.cloud.*"

- takeScreenshot: articles-share-url-mastra

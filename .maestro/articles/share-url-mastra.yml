# S-REWRITE-02 AC-3 / TC-3 — Share URL points to Mastra /article/ host
# Prerequisite: seeded public (or publishable) document + Metro + Zero + platform up.
# Requires installed app bundleId com.holocron.app on a named iOS Simulator.
# Oracle: after Share, system share sheet / link text must contain `/article/`
# and must not contain `.convex.site` / `.convex.cloud`.
#
# Probe2 /tmp/share-probe2-final.png: collapsed Expo gear FAB at top-right.
# "Runtime version" text misses collapsed state. Clear overlay before share:
#   1) tap gear area (~90%,14%) to expand
#   2) dismiss expanded menu via xmark/Close (hard when Reload visible)
#   3) wait until Runtime version / Reload gone
#   4) single-tap document-actions-button (left relative point, away from gear)
#   5) assert document-actions-sheet-share
# Unconditional second actions-button tap is forbidden.
appId: com.holocron.app
---
- launchApp:
    clearState: false

# Expanded Dev Menu left open from a prior step
- runFlow:
    when:
      visible: "Runtime version"
    commands:
      - tapOn:
          id: "xmark"
          optional: true
      - tapOn:
          text: "Close"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000

- openLink: holocron://articles

- extendedWaitUntil:
    visible:
      id: "article-card-pressable"
    timeout: 90000

- tapOn:
    id: "article-card-pressable"
    index: 0

- extendedWaitUntil:
    visible:
      id: "document-layout"
    timeout: 60000

# --- Clear collapsed Expo gear FAB (probe2-final) ---
# Collapsed gear has no "Runtime version" text — expand, dismiss, then
# swipe the FAB off the header so it cannot re-steal the ellipsis tap.
- tapOn:
    point: "90%,14%"
- waitForAnimationToEnd:
    timeout: 2500

# Dismiss expanded menu — prefer resource-id xmark (a11y Close)
- runFlow:
    when:
      visible: "Runtime version"
    commands:
      - tapOn:
          id: "xmark"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn:
          id: "xmark"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      visible: "Go home"
    commands:
      - tapOn:
          id: "xmark"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      visible: "Runtime version"
    commands:
      - tapOn:
          text: "Close"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000

- extendedWaitUntil:
    notVisible: "Runtime version"
    timeout: 8000
    optional: true
- extendedWaitUntil:
    notVisible: "Reload"
    timeout: 5000
    optional: true

# Drag collapsed gear down/away from the header ellipsis (persists across taps)
- swipe:
    start: "92%,12%"
    end: "92%,70%"
    duration: 800
- waitForAnimationToEnd:
    timeout: 1500

# If gear-area mis-tap already opened our sheet, skip re-open
- runFlow:
    when:
      notVisible:
        id: "document-actions-sheet-share"
    commands:
      - extendedWaitUntil:
          visible:
            id: "document-actions-button"
          timeout: 30000
      # Left half of ellipsis — away from residual gear on the right
      - tapOn:
          id: "document-actions-button"
          point: "15%,50%"

# Recovery: menu re-opened → X dismiss + left-side re-tap once
- runFlow:
    when:
      visible: "Runtime version"
    commands:
      - tapOn:
          id: "xmark"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      - swipe:
          start: "92%,12%"
          end: "92%,70%"
          duration: 600
          optional: true
      - tapOn:
          id: "document-actions-button"
          point: "15%,50%"
          optional: true

- extendedWaitUntil:
    visible:
      id: "document-actions-sheet-share"
    timeout: 20000

- assertVisible:
    id: "document-actions-sheet-share"

- tapOn:
    id: "document-actions-sheet-share"

- tapOn:
    text: "Share Link"
    optional: true

# iOS UIActivityViewController a11y shows host only ("2 Links / 127.0.0.1") —
# NEVER treat host-only as path proof. App must NOT pre-seed clipboard before
# Share.share (evidence theatre). Tap system Copy so the real shared payload
# lands on the pasteboard; gate driver verifies via simctl pbpaste (/article/).
- extendedWaitUntil:
    visible: "Copy"
    timeout: 20000
- assertVisible: "Copy"
- tapOn:
    text: "Copy"
- waitForAnimationToEnd:
    timeout: 2000

# Dismiss residual share sheet chrome (Copy already taken)
- tapOn:
    point: "50%,8%"
    optional: true
- tapOn:
    text: "Close"
    optional: true

# Genuinely user-visible share-preview banner (not 1×1/opacity oracle).
# Full URL text must include /article/; reject convex hosts.
- extendedWaitUntil:
    visible:
      id: "document-share-url-banner"
    timeout: 20000
- assertVisible:
    id: "document-share-url-banner"
- assertVisible:
    id: "document-share-url"
- assertVisible:
    id: "document-share-url-copy"
- assertVisible:
    text: ".*(/article/).*"
- assertNotVisible:
    text: ".*\\.convex\\.site.*"
- assertNotVisible:
    text: ".*\\.convex\\.cloud.*"

- takeScreenshot: articles-share-url-mastra

# S-REWRITE-02 AC-3 / TC-3 — Share URL points to Mastra /article/ host
# Prerequisite: seeded public (or publishable) document + Metro + Zero + platform up.
# Requires installed app bundleId com.holocron.app on a named iOS Simulator.
# Oracle: after Share, system share sheet / link text must contain `/article/`
# and must not contain `.convex.site` / `.convex.cloud`.
#
# Probe /tmp/share-after-single-tap.png: first document-actions-button tap can open
# Expo Dev Menu (Runtime version / Reload / Go home) instead of DocumentActionsSheet
# — gear FAB overlaps the header ellipsis. Dismiss Dev Menu (bounded, optional),
# then SINGLE-tap actions and wait for document-actions-sheet-share.
# Unconditional second tap is forbidden (button gone under menu → element not found).
appId: com.holocron.app
---
- launchApp:
    clearState: false

# Bounded optional Expo Dev Menu dismissal (start of flow)
- runFlow:
    when:
      visible: "Runtime version"
    commands:
      - tapOn:
          id: "xmark"
          optional: true
      - tapOn:
          text: "Close"
          optional: true
      - tapOn:
          text: ".*Close.*"
          optional: true
      - tapOn:
          point: "50%,12%"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000

- openLink: holocron://articles

- extendedWaitUntil:
    visible:
      id: "article-card-pressable"
    timeout: 90000

- tapOn:
    id: "article-card-pressable"
    index: 0

# Ensure document detail mounted before header actions
- extendedWaitUntil:
    visible:
      id: "document-layout"
    timeout: 60000

# Again: Dev Menu may still be open over the document
- runFlow:
    when:
      visible: "Runtime version"
    commands:
      - tapOn:
          id: "xmark"
          optional: true
      - tapOn:
          text: "Close"
          optional: true
      - tapOn:
          point: "50%,12%"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000

- extendedWaitUntil:
    visible:
      id: "document-actions-button"
    timeout: 30000

# SINGLE tap only — never unconditional double-tap
- tapOn:
    id: "document-actions-button"

# If tap opened Expo Dev Menu instead of our sheet: dismiss, then one optional re-tap
- runFlow:
    when:
      visible: "Runtime version"
    commands:
      - tapOn:
          id: "xmark"
          optional: true
      - tapOn:
          text: "Close"
          optional: true
      - tapOn:
          point: "50%,12%"
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      - extendedWaitUntil:
          visible:
            id: "document-actions-button"
          timeout: 10000
          optional: true
      - tapOn:
          id: "document-actions-button"
          optional: true

# Sheet content (Pressable share) — simplified Modal+View hierarchy
- extendedWaitUntil:
    visible:
      id: "document-actions-sheet-share"
    timeout: 20000

- assertVisible:
    id: "document-actions-sheet-share"

- tapOn:
    id: "document-actions-sheet-share"

# Legacy ActionSheet branch (optional; direct Share.share is preferred)
- tapOn:
    text: "Share Link"
    optional: true

# System share sheet may open and hide app hierarchy. Dismiss it so the
# in-app document-share-url oracle (full /article/ path) is queryable.
- runFlow:
    when:
      visible: "Copy"
    commands:
      - tapOn:
          point: "50%,8%"
- runFlow:
    when:
      visible: "Reminders"
    commands:
      - tapOn:
          point: "50%,8%"
- tapOn:
    text: "Close"
    optional: true

# GATE-FIX-007b: full URL is mounted as document-share-url (iOS share sheet
# accessibility only shows host like 127.0.0.1, not /article/ path).
- extendedWaitUntil:
    visible:
      id: "document-share-url"
    timeout: 20000

- assertVisible:
    id: "document-share-url"

- assertVisible:
    text: ".*(/article/).*"

# MUST NOT observe legacy Convex host rewrite
- assertNotVisible:
    text: ".*\\.convex\\.site.*"
- assertNotVisible:
    text: ".*\\.convex\\.cloud.*"

- takeScreenshot: articles-share-url-mastra

appId: ${MAESTRO_APP_ID}
---
# GATE-FIX-S26-01 / Sprint 26 human-gate step 2 — attach+preview only
# Distinct from .maestro/upload.yaml (step 7 all-in-one journey).
# MUST NOT assert submit/success terminal oracles (step 3 owns those).
# Prerequisite: Expo Dev Client + Metro (MAESTRO_METRO_URL) + seeded fixture.
# Attach uses deterministic e2e fixture (assets/e2e/test-fixture.jpg) via attach-button.

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      text: "DEVELOPMENT SERVERS"
    timeout: 20000
    optional: true

- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn:
          text: ${MAESTRO_METRO_URL}
          optional: true
      - tapOn:
          text: ".*http.*"
          optional: true

- runFlow:
    when:
      visible: "Metro has encountered an error"
    commands:
      - tapOn:
          text: "Reload"
          optional: true

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - tapOn:
          text: "Close"
          optional: true

- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 90000
    optional: true

- openLink: holocron://improvements

- extendedWaitUntil:
    visible:
      id: "improvements-route-layout"
    timeout: 45000
    optional: true

- runFlow:
    when:
      notVisible:
        id: "improvements-route-layout"
    commands:
      - openLink: holocron://improvements
      - extendedWaitUntil:
          visible:
            id: "improvements-route-layout"
          timeout: 60000

- assertVisible:
    id: "improvements-route-layout"

# Close a leftover sheet from a prior failed attempt
- runFlow:
    when:
      visible:
        id: "improvements-screen-submit-sheet-close"
    commands:
      - tapOn:
          id: "improvements-screen-submit-sheet-close"
          optional: true

- tapOn:
    id: "improvements-header-add-button"

- extendedWaitUntil:
    visible:
      id: "attach-button"
    timeout: 30000

- assertVisible:
    id: "attach-button"

# Loads tests/fixtures/test-fixture.jpg (bundled assets/e2e) in __DEV__/e2e
- tapOn:
    id: "attach-button"

- extendedWaitUntil:
    visible:
      id: "attach-preview"
    timeout: 20000

- assertVisible:
    id: "attach-preview"

- takeScreenshot: gate-step-2-attach-preview

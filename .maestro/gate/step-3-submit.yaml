appId: ${MAESTRO_APP_ID}
---
# GATE-FIX-S26-02 / Sprint 26 human-gate step 3 — attach+submit→upload-success
# Distinct from .maestro/gate/step-2-attach.yaml (attach+preview only)
# and .maestro/upload.yaml (step 7 all-in-one journey).
# Prerequisite: Expo Dev Client + Metro (MAESTRO_METRO_URL) + platform upload routes.
# Attach uses deterministic e2e fixture (assets/e2e/test-fixture.jpg) via attach-button.
# upload-success requires real CAS finalize (64-hex content hash) — not text-only.
#
# Failure modes this flow hardens against:
# - optional-only submit taps that no-op → never start upload
# - optional attach-preview → text-only submit → never shows upload-success
# - keyboard covering footer submit → dismiss + scroll + non-optional submit id

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      text: "DEVELOPMENT SERVERS"
    timeout: 20000
    optional: true

- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn:
          text: ${MAESTRO_METRO_URL}
          optional: true
      - tapOn:
          text: ".*http.*"
          optional: true

- runFlow:
    when:
      visible: "Metro has encountered an error"
    commands:
      - tapOn:
          text: "Reload"
          optional: true

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - tapOn:
          text: "Close"
          optional: true

- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 90000
    optional: true

- openLink: holocron://improvements

- extendedWaitUntil:
    visible:
      id: "improvements-route-layout"
    timeout: 45000
    optional: true

- runFlow:
    when:
      notVisible:
        id: "improvements-route-layout"
    commands:
      - openLink: holocron://improvements
      - extendedWaitUntil:
          visible:
            id: "improvements-route-layout"
          timeout: 60000

- assertVisible:
    id: "improvements-route-layout"

# Close a leftover sheet from a prior failed attempt
- runFlow:
    when:
      visible:
        id: "improvements-screen-submit-sheet-close"
    commands:
      - tapOn:
          id: "improvements-screen-submit-sheet-close"
          optional: true

- tapOn:
    id: "improvements-header-add-button"

- extendedWaitUntil:
    visible:
      id: "attach-button"
    timeout: 30000

- assertVisible:
    id: "attach-button"

# Loads tests/fixtures/test-fixture.jpg (bundled assets/e2e) in __DEV__/e2e
- tapOn:
    id: "attach-button"

# NON-optional: without attach-preview, submit is text-only and never surfaces upload-success
- extendedWaitUntil:
    visible:
      id: "attach-preview"
    timeout: 30000

- assertVisible:
    id: "attach-preview"

- extendedWaitUntil:
    visible:
      text: "Change image"
    timeout: 15000
    optional: true

- tapOn:
    id: "improvements-screen-submit-sheet-description-input"

- inputText: "Sprint 26 step-3 submit fixture"

# Dismiss keyboard so fixed footer Submit (testID …-submit-button) is hittable
- hideKeyboard:
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

# Product: testID base is improvements-screen-submit-sheet (app/(drawer)/improvements.tsx)
# → submit button resource-id = improvements-screen-submit-sheet-submit-button
# → accessibilityLabel = "Submit"
- extendedWaitUntil:
    visible:
      id: "improvements-screen-submit-sheet-submit-button"
    timeout: 20000

- assertVisible:
    id: "improvements-screen-submit-sheet-submit-button"

# NON-optional submit — fail closed if selector missing (do not soft-skip)
- tapOn:
    id: "improvements-screen-submit-sheet-submit-button"

# Fallback if id hit missed the pressable (rare layout race)
- runFlow:
    when:
      notVisible:
        id: "upload-progress"
    commands:
      - runFlow:
          when:
            notVisible:
              id: "upload-success"
          commands:
            - tapOn:
                text: "Submit"
                optional: true
            - tapOn:
                id: "improvements-screen-submit-sheet-submit-button"
                optional: true

# Retry if residual error from earlier hot-reload attempt
- runFlow:
    when:
      visible:
        id: "upload-retry"
    commands:
      - tapOn:
          id: "upload-retry"

# upload-success requires real CAS finalize (64-hex content hash) — not text-only
- extendedWaitUntil:
    visible:
      id: "upload-success"
    timeout: 120000

- assertVisible:
    id: "upload-success"

- takeScreenshot: gate-step-3-submit-success

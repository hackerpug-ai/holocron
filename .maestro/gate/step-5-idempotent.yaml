appId: ${MAESTRO_APP_ID}
---
# GATE-FIX-S26-03 / Sprint 26 human-gate step 5 — idempotent re-submit (identical fixture twice)
# Distinct from:
#   - .maestro/gate/step-2-attach.yaml (attach+preview only)
#   - .maestro/gate/step-3-submit.yaml (single attach+submit→success)
#   - .maestro/upload.yaml (step 7 all-in-one journey)
# Self-contained: first attach+submit creates one CAS row; second attach+submit of the
# identical fixture exercises content_hash idempotency (still one file_objects row).
# Prerequisite: Expo Dev Client + Metro (MAESTRO_METRO_URL) + platform upload routes.
# Prefer holo seed:e2e --reset before this flow so file_objects start empty.
# upload-success requires real CAS finalize (64-hex content hash) — not text-only.

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      text: "DEVELOPMENT SERVERS"
    timeout: 20000
    optional: true

- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn:
          text: ${MAESTRO_METRO_URL}
          optional: true
      - tapOn:
          text: ".*http.*"
          optional: true

- runFlow:
    when:
      visible: "Metro has encountered an error"
    commands:
      - tapOn:
          text: "Reload"
          optional: true

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - tapOn:
          text: "Close"
          optional: true

- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 90000
    optional: true

- openLink: holocron://improvements

- extendedWaitUntil:
    visible:
      id: "improvements-route-layout"
    timeout: 45000
    optional: true

- runFlow:
    when:
      notVisible:
        id: "improvements-route-layout"
    commands:
      - openLink: holocron://improvements
      - extendedWaitUntil:
          visible:
            id: "improvements-route-layout"
          timeout: 60000

- assertVisible:
    id: "improvements-route-layout"

# Close a leftover sheet from a prior failed attempt
- runFlow:
    when:
      visible:
        id: "improvements-screen-submit-sheet-close"
    commands:
      - tapOn:
          id: "improvements-screen-submit-sheet-close"
          optional: true

# ── Pass 1: attach + submit identical fixture → upload-success ──────────────
# (mirrors step-3-submit.yaml submit path so the first finalize is reliable)
- tapOn:
    id: "improvements-header-add-button"

- extendedWaitUntil:
    visible:
      id: "attach-button"
    timeout: 30000

- assertVisible:
    id: "attach-button"

# Loads tests/fixtures/test-fixture.jpg (bundled assets/e2e) in __DEV__/e2e
- tapOn:
    id: "attach-button"

- extendedWaitUntil:
    visible:
      id: "attach-preview"
    timeout: 20000
    optional: true

- extendedWaitUntil:
    visible:
      text: "Change image"
    timeout: 15000
    optional: true

- tapOn:
    id: "improvements-screen-submit-sheet-description-input"

# Keep description short so fixed footer (Cancel/Submit) stays on-screen.
- inputText: "Sprint 26 step-5 pass1"

- hideKeyboard:
    optional: true

- waitForAnimationToEnd:
    timeout: 5000

# Dismiss keyboard a second time if still covering footer.
- tapOn:
    id: "improvements-screen-submit-sheet-scroll"
    optional: true

- hideKeyboard:
    optional: true

- scrollUntilVisible:
    element:
      id: "improvements-screen-submit-sheet-submit-button"
    direction: DOWN
    timeout: 15000
    optional: true

- swipe:
    direction: UP
    duration: 400
    optional: true

- extendedWaitUntil:
    visible:
      id: "improvements-screen-submit-sheet-submit-button"
    timeout: 20000
    optional: true

# Prefer footer submit (always mounted). Fall back to label / right-side footer point.
- tapOn:
    id: "improvements-screen-submit-sheet-submit-button"
    optional: true

- tapOn:
    text: "Submit"
    optional: true

- tapOn:
    id: "improvements-screen-submit-sheet-footer"
    optional: true
    retryTapIfNoChange: false

# Right half of footer ≈ Submit (Cancel is left)
- tapOn:
    point: "75%,92%"
    optional: true

- runFlow:
    when:
      visible:
        id: "upload-retry"
    commands:
      - tapOn:
          id: "upload-retry"

# First finalize — real CAS content hash
- extendedWaitUntil:
    visible:
      id: "upload-success"
    timeout: 120000

- assertVisible:
    id: "upload-success"

# Dismiss sheet so pass 2 is a true re-open + re-submit (not residual success UI)
- runFlow:
    when:
      visible:
        id: "upload-done"
    commands:
      - tapOn:
          id: "upload-done"
          optional: true

- runFlow:
    when:
      visible:
        id: "improvements-screen-submit-sheet-close"
    commands:
      - tapOn:
          id: "improvements-screen-submit-sheet-close"
          optional: true

- extendedWaitUntil:
    notVisible:
      id: "upload-success"
    timeout: 15000
    optional: true

- waitForAnimationToEnd:
    timeout: 5000

# ── Pass 2: re-attach + re-submit identical fixture → upload-success again ──
- tapOn:
    id: "improvements-header-add-button"

- extendedWaitUntil:
    visible:
      id: "attach-button"
    timeout: 30000

- assertVisible:
    id: "attach-button"

# Same deterministic fixture → same content_hash → CAS idempotency
- tapOn:
    id: "attach-button"

- extendedWaitUntil:
    visible:
      id: "attach-preview"
    timeout: 20000
    optional: true

- extendedWaitUntil:
    visible:
      text: "Change image"
    timeout: 15000
    optional: true

- tapOn:
    id: "improvements-screen-submit-sheet-description-input"

- inputText: "Sprint 26 step-5 pass2"

- hideKeyboard:
    optional: true

- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    id: "improvements-screen-submit-sheet-scroll"
    optional: true

- hideKeyboard:
    optional: true

- scrollUntilVisible:
    element:
      id: "improvements-screen-submit-sheet-submit-button"
    direction: DOWN
    timeout: 15000
    optional: true

- swipe:
    direction: UP
    duration: 400
    optional: true

- extendedWaitUntil:
    visible:
      id: "improvements-screen-submit-sheet-submit-button"
    timeout: 20000
    optional: true

- tapOn:
    id: "improvements-screen-submit-sheet-submit-button"
    optional: true

- tapOn:
    text: "Submit"
    optional: true

- tapOn:
    id: "improvements-screen-submit-sheet-footer"
    optional: true
    retryTapIfNoChange: false

- tapOn:
    point: "75%,92%"
    optional: true

- runFlow:
    when:
      visible:
        id: "upload-retry"
    commands:
      - tapOn:
          id: "upload-retry"

# Second finalize of identical bytes — still upload-success (hash present)
- extendedWaitUntil:
    visible:
      id: "upload-success"
    timeout: 120000

- assertVisible:
    id: "upload-success"

- takeScreenshot: gate-step-5-idempotent-resubmit

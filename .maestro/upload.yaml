appId: ${MAESTRO_APP_ID}
---
# T-DATA-021 / Sprint 26 — content-addressed image upload via improvements sheet
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "DEVELOPMENT SERVERS"
    timeout: 20000
    optional: true

- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn:
          text: ${MAESTRO_METRO_URL}
          optional: true

- runFlow:
    when:
      visible: "Metro has encountered an error"
    commands:
      - tapOn:
          text: "Reload"
          optional: true

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - tapOn:
          text: "Close"
          optional: true

- openLink: holocron://improvements

- extendedWaitUntil:
    visible:
      id: "improvements-route-layout"
    timeout: 90000

- tapOn:
    id: "improvements-header-add-button"

- extendedWaitUntil:
    visible:
      id: "attach-button"
    timeout: 30000

- tapOn:
    id: "attach-button"

- tapOn:
    id: "improvements-screen-submit-sheet-description-input"

- inputText: "Sprint 26 upload lifecycle fixture"

- tapOn:
    id: "improvements-screen-submit-sheet-submit-button"

- extendedWaitUntil:
    visible:
      id: "upload-success"
    timeout: 90000

- assertVisible:
    id: "upload-success"

- takeScreenshot: sprint-26-upload-lifecycle

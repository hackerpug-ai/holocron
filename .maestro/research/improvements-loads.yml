# S-REWRITE-04 AC-2 / TC-2 — Improvements list loads via Zero query
# Prerequisite: holo seed:e2e --reset (seeded improvement rows) + cold boot
appId: com.holocron.app
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "DEVELOPMENT SERVERS"
    timeout: 15000
    optional: true

- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn:
          text: ${MAESTRO_METRO_URL}
          optional: true

- runFlow:
    when:
      visible: "Metro has encountered an error"
    commands:
      - tapOn:
          text: "Reload"
          optional: true

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - tapOn:
          text: "Close"
          optional: true

- openLink: holocron://improvements

- extendedWaitUntil:
    visible:
      id: "improvements-route-layout"
    timeout: 90000

- assertVisible:
    id: "improvements-route-layout"

# MUST observe >=1 improvement row (not empty state)
- assertNotVisible:
    id: "improvements-screen-empty"
    optional: true

- extendedWaitUntil:
    visible:
      id: "improvements-screen-list"
    timeout: 30000
    optional: true

- takeScreenshot: S-REWRITE-04-AC-2-improvements-loads

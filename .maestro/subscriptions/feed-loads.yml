appId: com.holocron.app
---
# AC-1 / TC-1: Feed list loads 5 seeded feed items via Zero
# Prerequisite: holo seed:e2e --reset (5 feed items) + cold boot on named iOS Simulator

- launchApp:
    clearState: true

- openLink: holocron://whats-new

- extendedWaitUntil:
    visible:
      id: "whats-new-feed"
    timeout: 90000

- assertVisible:
    id: "whats-new-feed"

# Seeded feed / findings rows — NewsfeedScreen uses `${testID}-finding-${index}`
- extendedWaitUntil:
    visible:
      id: "whats-new-feed-finding-0"
    timeout: 30000

- assertVisible:
    id: "whats-new-feed-finding-0"
- assertVisible:
    id: "whats-new-feed-finding-1"
- assertVisible:
    id: "whats-new-feed-finding-2"
- assertVisible:
    id: "whats-new-feed-finding-3"
- assertVisible:
    id: "whats-new-feed-finding-4"

- takeScreenshot: feed-loads-seeded

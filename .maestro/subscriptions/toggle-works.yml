appId: com.holocron.app
---
# AC-4 / TC-4: Subscription toggle persists via Zero mutator (5s SLO)

- launchApp:
    clearState: true

- openLink: holocron://subscriptions

- extendedWaitUntil:
    visible:
      id: "subscriptions-list"
    timeout: 90000

- tapOn:
    id: "toggle-auto-research-standalone"
    optional: true

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "subscriptions-list"

- takeScreenshot: toggle-works-seeded

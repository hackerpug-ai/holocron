appId: ${MAESTRO_APP_ID}
---
# AC-5 / TC-5: Social posts load via Zero

- launchApp:
    clearState: true

- openLink: holocron://subscriptions/feed

- extendedWaitUntil:
    visible:
      id: "social-posts-list"
    timeout: 90000

- assertVisible:
    id: "social-posts-list"

- extendedWaitUntil:
    visible:
      id: "social-posts-list-card-0"
    timeout: 30000
    optional: true

- takeScreenshot: social-loads-seeded

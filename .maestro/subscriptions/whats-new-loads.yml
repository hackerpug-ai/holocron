appId: com.holocron.app
---
# AC-3 / TC-3: Whats-new feed loads via Zero
# DATA oracle (whats-new-feed + finding-0) is NON-optional.
#
# Full-driver step4 fail (preserved): openLink holocron://whats-new COMPLETED but
# whats-new-feed never appeared — app stayed on chat (deep-link hostname form
# holocron://whats-new was ignored when only parsed.path was checked).
# Fix: app resolves hostname→route; flow retries via drawer-section-whats-new.
#
# HIGH-3 hang note: empty-state checks are BOUNDED (fail closed, no indefinite wait).

- launchApp:
    clearState: false

# Primary: deep link (must work after app fix for hostname form)
- openLink: holocron://whats-new

# If deep link did not navigate (race / stale native build), open drawer and tap section
- runFlow:
    when:
      notVisible:
        id: "whats-new-feed"
    commands:
      - tapOn:
          id: "chat-header-menu-button"
          optional: true
      - tapOn:
          id: "screen-header-menu-button"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "drawer-content"
          timeout: 15000
          optional: true
      - tapOn:
          id: "drawer-section-whats-new"
          optional: true
      - tapOn:
          text: "What's New"
          optional: true

# NON-OPTIONAL: feed shell (90s — route may remount after drawer nav)
- extendedWaitUntil:
    visible:
      id: "whats-new-feed"
    timeout: 90000

- assertVisible:
    id: "whats-new-feed"

# Seeded finding row (positive oracle)
- extendedWaitUntil:
    visible:
      id: "whats-new-feed-finding-0"
    timeout: 60000

- assertVisible:
    id: "whats-new-feed-finding-0"

# Empty shell must not remain — BOUNDED fail-closed
- extendedWaitUntil:
    notVisible:
      id: "whats-new-feed-empty"
    timeout: 10000

- takeScreenshot: whats-new-loads-seeded

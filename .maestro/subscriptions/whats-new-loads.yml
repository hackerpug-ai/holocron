appId: com.holocron.app
---
# AC-3 / TC-3: Whats-new feed loads via Zero
# DATA oracle (whats-new-feed + finding-0) is NON-optional.
#
# Run2 fail: openLink holocron://whats-new COMPLETED, feed never visible (stayed on chat).
# App fix: resolveHolocronRoute hostname form + router.navigate.
# Flow: try hostname + path-form deep links, then drawer section fallback.

- launchApp:
    clearState: false

# 1) Hostname form (Maestro openLink default)
- openLink: holocron://whats-new

# 2) Path form if still not on feed (linking parse alternate)
- runFlow:
    when:
      notVisible:
        id: "whats-new-feed"
    commands:
      - openLink: holocron:///whats-new

# 3) Drawer navigation fallback (works from chat or after back from articles)
- runFlow:
    when:
      notVisible:
        id: "whats-new-feed"
    commands:
      # Leave articles/detail if needed
      - tapOn:
          id: "screen-header-back-button"
          optional: true
      - tapOn:
          id: "articles-route-layout-back-button"
          optional: true
      - tapOn:
          id: "chat-header-menu-button"
          optional: true
      - tapOn:
          id: "screen-header-menu-button"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "drawer-content"
          timeout: 15000
          optional: true
      - tapOn:
          id: "drawer-section-whats-new"
          optional: true
      - tapOn:
          text: "What's New"
          optional: true

# NON-OPTIONAL: feed shell
- extendedWaitUntil:
    visible:
      id: "whats-new-feed"
    timeout: 90000

- assertVisible:
    id: "whats-new-feed"

# Seeded finding row
- extendedWaitUntil:
    visible:
      id: "whats-new-feed-finding-0"
    timeout: 60000

- assertVisible:
    id: "whats-new-feed-finding-0"

# Empty shell must not remain — BOUNDED fail-closed
- extendedWaitUntil:
    notVisible:
      id: "whats-new-feed-empty"
    timeout: 10000

- takeScreenshot: whats-new-loads-seeded

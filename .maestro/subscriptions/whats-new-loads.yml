appId: com.holocron.app
---
# AC-3 / TC-3: Whats-new feed loads via Zero
# DATA oracle (whats-new-feed + finding-0) is NON-optional.
#
# HIGH-3 hang note: unbounded assertNotVisible on empty can hang full driver.
# Bound empty-state checks; fail closed quickly.

# clearState false so sequential human-gate runs keep Dev Client + Metro session.
# Standalone cold boot: run drawer-loads-seeded first or set MAESTRO_DEV_CLIENT_OPEN_URL.
- launchApp:
    clearState: false

- openLink: holocron://whats-new

# NON-OPTIONAL: seeded What's New feed shell (5 items path)
- extendedWaitUntil:
    visible:
      id: "whats-new-feed"
    timeout: 90000

- assertVisible:
    id: "whats-new-feed"

# Seeded finding rows first (positive oracle) — stronger than empty negation alone
- extendedWaitUntil:
    visible:
      id: "whats-new-feed-finding-0"
    timeout: 60000

- assertVisible:
    id: "whats-new-feed-finding-0"

# Empty shell must not remain once finding-0 is present — BOUNDED fail-closed
- extendedWaitUntil:
    notVisible:
      id: "whats-new-feed-empty"
    timeout: 10000

- takeScreenshot: whats-new-loads-seeded

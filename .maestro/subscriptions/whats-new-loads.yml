appId: com.holocron.app
---
# AC-3 / TC-3: Whats-new feed loads via Zero
# DATA oracle (whats-new-feed) is NON-optional.
# Finding row / detail navigation is out of scope for this gate oracle.

# clearState false so sequential human-gate runs keep Dev Client + Metro session.
# Standalone cold boot: run drawer-loads-seeded first or set MAESTRO_DEV_CLIENT_OPEN_URL.
- launchApp:
    clearState: false

- openLink: holocron://whats-new

# NON-OPTIONAL: seeded What's New feed shell (5 items path)
- extendedWaitUntil:
    visible:
      id: "whats-new-feed"
    timeout: 90000

- assertVisible:
    id: "whats-new-feed"

# HIGH-3 / GATE-FIX-002: fail empty shell — must not pass on loading/empty-only list.
# NewsfeedScreen empty ListEmptyComponent uses testID `${feed}-empty` → whats-new-feed-empty.
- assertNotVisible:
    id: "whats-new-feed-empty"

# Seeded finding rows (hero finding-0) — NON-optional data oracle beyond shell
- extendedWaitUntil:
    visible:
      id: "whats-new-feed-finding-0"
    timeout: 60000

- assertVisible:
    id: "whats-new-feed-finding-0"

- takeScreenshot: whats-new-loads-seeded

appId: com.holocron.app
---
# AC-3 / TC-3: Whats-new feed loads via Zero
# DATA oracles (assertVisible whats-new-feed + finding-0) are NON-optional.
#
# TC-7 / static audit contract:
# - Branch/fallback conditions MUST NOT name data-oracle ids (whats-new-feed).
# - Use layout id (whats-new-layout) for when:notVisible navigation retries so
#   optional chrome taps never sit within N lines of a data-oracle id line.
# - Authoritative QA fail (qa-real-7step-20260724T052913Z): TC-7 flagged
#   whats-new-loads.yml:23 as optional when feed id appeared in when:notVisible
#   near drawer optional:true chrome — refuse driver before any 7-step run.

- launchApp:
    clearState: false

# 1) Hostname form (Maestro openLink default)
- openLink: holocron://whats-new

# 2) Path form if layout not mounted (linking parse alternate)
#    Condition uses layout shell id — NOT the data oracle whats-new-feed.
- runFlow:
    when:
      notVisible:
        id: "whats-new-layout"
    commands:
      - openLink: holocron:///whats-new

# 3) Drawer navigation fallback (from chat / after back from articles)
- runFlow:
    when:
      notVisible:
        id: "whats-new-layout"
    commands:
      - tapOn:
          id: "screen-header-back-button"
          optional: true
      - tapOn:
          id: "articles-route-layout-back-button"
          optional: true
      - tapOn:
          id: "chat-header-menu-button"
          optional: true
      - tapOn:
          id: "screen-header-menu-button"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "drawer-content"
          timeout: 15000
          optional: true
      - tapOn:
          id: "drawer-section-whats-new"
          optional: true
      - tapOn:
          text: "What's New"
          optional: true

# === DATA ORACLES (non-optional; no optional:true in these blocks) ===

# NON-OPTIONAL: feed shell
- extendedWaitUntil:
    visible:
      id: "whats-new-feed"
    timeout: 90000

- assertVisible:
    id: "whats-new-feed"

# Seeded finding row
- extendedWaitUntil:
    visible:
      id: "whats-new-feed-finding-0"
    timeout: 60000

- assertVisible:
    id: "whats-new-feed-finding-0"

# Empty shell must not remain — BOUNDED fail-closed (not optional)
- extendedWaitUntil:
    notVisible:
      id: "whats-new-feed-empty"
    timeout: 10000

- takeScreenshot: whats-new-loads-seeded

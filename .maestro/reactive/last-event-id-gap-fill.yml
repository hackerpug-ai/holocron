appId: ${MAESTRO_APP_ID}
---
# AC-4 / TC-4 — Last-Event-ID gap-fill delivers only unobserved events.

- launchApp:
    clearState: false

- waitForAnimationToEnd
- openLink: ${MAESTRO_DEV_CLIENT_OPEN_URL}
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "DEVELOPMENT SERVERS"
    timeout: 5000
    optional: true

- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn:
          text: ${MAESTRO_METRO_URL}
          optional: true
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - tapOn:
          text: "Close"
          optional: true

- extendedWaitUntil:
    notVisible:
      text: "Downloading"
    timeout: 60000
    optional: true

- openLink: holocron://chat/00000000-0000-4000-8000-0000000000e4
- waitForAnimationToEnd

- runFlow:
    when:
      notVisible:
        id: "chat-screen"
    commands:
      - waitForAnimationToEnd
      - openLink: holocron://chat/00000000-0000-4000-8000-0000000000e4
      - waitForAnimationToEnd

- runFlow:
    when:
      notVisible:
        id: "chat-screen"
    commands:
      - waitForAnimationToEnd
      - openLink: ${MAESTRO_DEV_CLIENT_OPEN_URL}
      - waitForAnimationToEnd
      - openLink: holocron://chat/00000000-0000-4000-8000-0000000000e4
      - waitForAnimationToEnd

# Re-assert deep link after Zero list settles (prevents most-recent theft)
- openLink: holocron://chat/00000000-0000-4000-8000-0000000000e4
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 90000

- assertVisible:
    id: "chat-screen"

- extendedWaitUntil:
    visible:
      id: "chat-input-field"
    timeout: 45000

- tapOn:
    id: "chat-input-field"
- eraseText

- inputText: "List eight distinct short words about rivers, one at a time."

- extendedWaitUntil:
    visible:
      id: "chat-input-send-button"
    timeout: 10000

- tapOn:
    id: "chat-input-send-button"

- extendedWaitUntil:
    visible:
      id: "stop-generating-button"
    timeout: 45000

- assertVisible:
    id: "stop-generating-button"

- extendedWaitUntil:
    visible:
      id: "chat-stream-token-count-at-least-1"
    timeout: 45000

- assertVisible:
    id: "chat-stream-token-count-at-least-1"

- extendedWaitUntil:
    visible:
      id: "chat-stream-last-seq"
    timeout: 45000

- assertVisible:
    id: "chat-stream-last-seq"

- extendedWaitUntil:
    visible:
      id: "chat-assistant-message-streaming"
    timeout: 15000
    optional: true

- setAirplaneMode: enabled
- waitForAnimationToEnd:
    timeout: 3000
- setAirplaneMode: disabled

- extendedWaitUntil:
    notVisible:
      id: "stop-generating-button"
    timeout: 120000

- assertNotVisible:
    id: "stop-generating-button"

- extendedWaitUntil:
    visible:
      id: "chat-assistant-message-latest"
    timeout: 60000

- assertVisible:
    id: "chat-assistant-message-latest"

# REDHAT-FIX-01 PATH-A: required oracle — title 'Streaming' seeded by seed:e2e
- extendedWaitUntil:
    visible: "Streaming"
    timeout: 30000
- extendedWaitUntil:
    visible: "Streaming"
    timeout: 60000

- takeScreenshot: S-REACTIVE-01-AC-4-last-event-id-gap-fill

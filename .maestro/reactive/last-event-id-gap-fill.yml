appId: ${MAESTRO_APP_ID}
---
# AC-4 / TC-4 — Last-Event-ID gap-fill delivers only unobserved events

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 60000

- tapOn:
    id: "chat-header-menu-button"
    optional: true
- tapOn:
    id: "screen-header-menu-button"
    optional: true
- extendedWaitUntil:
    visible:
      id: "conversation-row"
    timeout: 15000
    optional: true
- tapOn:
    id: "conversation-row"
    index: 0
    optional: true

- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 15000

- tapOn:
    id: "chat-input-field"
    optional: true
- tapOn:
    id: "chat-input"
    optional: true

- inputText: "List eight distinct short words about rivers, one at a time."

- tapOn:
    id: "chat-input-send-button"

- extendedWaitUntil:
    visible:
      id: "stop-generating-button"
    timeout: 20000

- extendedWaitUntil:
    visible:
      id: "chat-stream-last-seq"
    timeout: 20000
    optional: true

# Drop mid-stream so client reconnects with Last-Event-ID
- setAirplaneMode: enabled
- waitForAnimationToEnd:
    timeout: 3000
- setAirplaneMode: disabled

- extendedWaitUntil:
    notVisible:
      id: "stop-generating-button"
    timeout: 90000
    optional: true

- assertVisible:
    id: "chat-assistant-message"

- takeScreenshot: S-REACTIVE-01-AC-4-last-event-id-gap-fill

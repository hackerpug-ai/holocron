appId: ${MAESTRO_APP_ID}
---
# AC-5 / TC-5 — Cancel finalizes partial turn; composer re-enabled
# Env: MAESTRO_APP_ID, MAESTRO_DEV_CLIENT_OPEN_URL, MAESTRO_CHAT_URL, MAESTRO_METRO_URL

- launchApp:
    clearState: false

- waitForAnimationToEnd
- openLink: ${MAESTRO_DEV_CLIENT_OPEN_URL}
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "DEVELOPMENT SERVERS"
    timeout: 5000
    optional: true

- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn:
          text: ${MAESTRO_METRO_URL}
          optional: true
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - tapOn:
          text: "Close"
          optional: true

- openLink: ${MAESTRO_CHAT_URL}
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 90000

- assertVisible:
    id: "chat-screen"

- extendedWaitUntil:
    visible:
      id: "chat-input-field"
    timeout: 30000

- tapOn:
    id: "chat-input-field"
- eraseText

- inputText: "Write a long detailed multi-paragraph essay about rivers and mountains for cancel probe."

- extendedWaitUntil:
    visible:
      id: "chat-input-send-button"
    timeout: 10000

- tapOn:
    id: "chat-input-send-button"

- extendedWaitUntil:
    visible:
      id: "stop-generating-button"
    timeout: 30000

- assertVisible:
    id: "stop-generating-button"

- waitForAnimationToEnd:
    timeout: 1500

- tapOn:
    id: "stop-generating-button"

- extendedWaitUntil:
    notVisible:
      id: "stop-generating-button"
    timeout: 15000

- assertNotVisible:
    id: "stop-generating-button"

- assertVisible:
    id: "chat-input"

# Composer re-enabled: field accepts focus + text after cancel (no stuck agent_busy)
- tapOn:
    id: "chat-input-field"
- eraseText
- inputText: "post-cancel ok"
- waitForAnimationToEnd

# Either send button appears (text accepted) or field remains editable without stop
- assertNotVisible:
    id: "stop-generating-button"

- takeScreenshot: S-REACTIVE-01-AC-5-cancel-stops-stream

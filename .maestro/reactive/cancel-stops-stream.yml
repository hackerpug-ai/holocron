appId: ${MAESTRO_APP_ID}
---
# AC-5 / TC-5 — Cancel finalizes partial turn via Hono cancel command

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 60000

- tapOn:
    id: "chat-header-menu-button"
    optional: true
- tapOn:
    id: "screen-header-menu-button"
    optional: true
- extendedWaitUntil:
    visible:
      id: "conversation-row"
    timeout: 15000
    optional: true
- tapOn:
    id: "conversation-row"
    index: 0
    optional: true

- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 15000

- tapOn:
    id: "chat-input-field"
    optional: true
- tapOn:
    id: "chat-input"
    optional: true

- inputText: "Write a long detailed multi-paragraph essay about rivers and mountains for cancel probe."

- tapOn:
    id: "chat-input-send-button"

- extendedWaitUntil:
    visible:
      id: "stop-generating-button"
    timeout: 20000

- assertVisible:
    id: "stop-generating-button"

# Wait for a few tokens then cancel
- extendedWaitUntil:
    visible:
      id: "streaming-cursor"
    timeout: 20000
    optional: true

- waitForAnimationToEnd:
    timeout: 1500

- tapOn:
    id: "stop-generating-button"

# Oracle: cancelled — stop control gone, phase cancelled, partial persists
- extendedWaitUntil:
    notVisible:
      id: "stop-generating-button"
    timeout: 15000

- assertNotVisible:
    id: "stop-generating-button"

- assertVisible:
    id: "chat-assistant-message"
    optional: true

- takeScreenshot: S-REACTIVE-01-AC-5-cancel-stops-stream

appId: ${MAESTRO_APP_ID}
---
# AC-3 / TC-3 — Exactly one final assistant message for the NEW turn
# (chat-assistant-message-latest), not the seed row.

- launchApp:
    clearState: false

- waitForAnimationToEnd
- openLink: ${MAESTRO_DEV_CLIENT_OPEN_URL}
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "DEVELOPMENT SERVERS"
    timeout: 5000
    optional: true

- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn:
          text: ${MAESTRO_METRO_URL}
          optional: true
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - tapOn:
          text: "Close"
          optional: true

- extendedWaitUntil:
    notVisible:
      text: "Downloading"
    timeout: 60000
    optional: true

- openLink: holocron://chat/00000000-0000-4000-8000-0000000000e4
- waitForAnimationToEnd

- runFlow:
    when:
      notVisible:
        id: "chat-screen"
    commands:
      - waitForAnimationToEnd
      - openLink: holocron://chat/00000000-0000-4000-8000-0000000000e4
      - waitForAnimationToEnd

- runFlow:
    when:
      notVisible:
        id: "chat-screen"
    commands:
      - waitForAnimationToEnd
      - openLink: ${MAESTRO_DEV_CLIENT_OPEN_URL}
      - waitForAnimationToEnd
      - openLink: holocron://chat/00000000-0000-4000-8000-0000000000e4
      - waitForAnimationToEnd

# Re-assert deep link after Zero list settles (prevents most-recent theft)
- openLink: holocron://chat/00000000-0000-4000-8000-0000000000e4
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 90000

- assertVisible:
    id: "chat-screen"

- extendedWaitUntil:
    visible:
      id: "chat-input-field"
    timeout: 45000

- tapOn:
    id: "chat-input-field"
- eraseText

- inputText: "Reply with a short greeting only."

- extendedWaitUntil:
    visible:
      id: "chat-input-send-button"
    timeout: 10000

- tapOn:
    id: "chat-input-send-button"

- extendedWaitUntil:
    visible:
      id: "stop-generating-button"
    timeout: 45000
    optional: true

- extendedWaitUntil:
    notVisible:
      id: "stop-generating-button"
    timeout: 120000

# Final NEW-turn bubble (not seed Assistant seed reply…)
- extendedWaitUntil:
    visible:
      id: "chat-assistant-message-latest"
    timeout: 90000

- assertVisible:
    id: "chat-assistant-message-latest"

# REDHAT-FIX-11 PATH-A: content byte-equal oracle — rendered latest assistant
# text === durable Zero/chat_messages.content (not bubble-count alone, not
# redhat-fix-04 UNIQUE_TEXT SSE stub). Mismatch testID must stay invisible.
- extendedWaitUntil:
    visible:
      id: "chat-content-byte-equal"
    timeout: 90000

- assertVisible:
    id: "chat-content-byte-equal"

- assertNotVisible:
    id: "chat-content-byte-mismatch"

# REDHAT-FIX-01 PATH-A: required oracle — title 'Streaming' seeded by seed:e2e
- extendedWaitUntil:
    visible: "Streaming"
    timeout: 30000
- extendedWaitUntil:
    visible: "Streaming"
    timeout: 60000

- takeScreenshot: S-REACTIVE-01-AC-3-exactly-one-final-message

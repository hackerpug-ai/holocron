appId: ${MAESTRO_APP_ID}
---
# AC-3 / TC-3 [PRIMARY] — Exactly one final assistant message matching Zero durable row

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 60000

- tapOn:
    id: "chat-header-menu-button"
    optional: true
- tapOn:
    id: "screen-header-menu-button"
    optional: true
- extendedWaitUntil:
    visible:
      id: "conversation-row"
    timeout: 15000
    optional: true
- tapOn:
    id: "conversation-row"
    index: 0
    optional: true

- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 15000

- tapOn:
    id: "chat-input-field"
    optional: true
- tapOn:
    id: "chat-input"
    optional: true

- inputText: "Reply with a short greeting only."

- tapOn:
    id: "chat-input-send-button"

# Wait for stream complete (stop control disappears, phase complete)
- extendedWaitUntil:
    visible:
      id: "stop-generating-button"
    timeout: 20000
    optional: true

- extendedWaitUntil:
    notVisible:
      id: "stop-generating-button"
    timeout: 90000
    optional: true

- extendedWaitUntil:
    notVisible:
      id: "streaming-cursor"
    timeout: 30000
    optional: true

# Oracle: at least one assistant message; phase complete when exposed
- extendedWaitUntil:
    visible:
      id: "chat-assistant-message"
    timeout: 60000

- assertVisible:
    id: "chat-assistant-message"

- assertVisible:
    id: "chat-stream-phase"
    optional: true

- takeScreenshot: S-REACTIVE-01-AC-3-exactly-one-final-message

appId: ${MAESTRO_APP_ID}
---
# AC-1 / TC-1 — Token streaming over real SSE socket
# Prerequisite: holo seed:e2e --reset; platform + Zero healthy.
# MAESTRO_APP_ID must be com.holocron.app (see app.config.cjs bundleIdentifier).

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 60000

# Prefer seeded Streaming / Alpha conversation via drawer when present
- tapOn:
    id: "chat-header-menu-button"
    optional: true
- tapOn:
    id: "screen-header-menu-button"
    optional: true
- extendedWaitUntil:
    visible:
      id: "conversation-row"
    timeout: 15000
    optional: true
- tapOn:
    id: "conversation-row"
    index: 0
    optional: true

- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 15000

- tapOn:
    id: "chat-input-field"
    optional: true
- tapOn:
    id: "chat-input"
    optional: true

- inputText: "What is two plus two?"

- tapOn:
    id: "chat-input-send-button"

# Oracle: stream enters streaming phase (real SSE)
- extendedWaitUntil:
    visible:
      id: "chat-stream-phase"
    timeout: 20000
    optional: true

# Oracle: stop control appears while streaming
- extendedWaitUntil:
    visible:
      id: "stop-generating-button"
    timeout: 20000
    optional: true

# Oracle: single in-progress assistant bubble (token-by-token)
- extendedWaitUntil:
    visible:
      id: "chat-assistant-message"
    timeout: 60000

- assertVisible:
    id: "chat-assistant-message"

# Streaming cursor or streaming message id while tokens append
- extendedWaitUntil:
    visible:
      id: "streaming-cursor"
    timeout: 30000
    optional: true

- takeScreenshot: S-REACTIVE-01-AC-1-token-streaming

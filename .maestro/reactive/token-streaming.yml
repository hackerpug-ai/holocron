appId: ${MAESTRO_APP_ID}
---
# AC-1 / TC-1 — Token streaming over real SSE socket
# Env: MAESTRO_APP_ID, MAESTRO_DEV_CLIENT_OPEN_URL, MAESTRO_CHAT_URL, MAESTRO_METRO_URL

- launchApp:
    clearState: false

- waitForAnimationToEnd
- openLink: ${MAESTRO_DEV_CLIENT_OPEN_URL}
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "DEVELOPMENT SERVERS"
    timeout: 5000
    optional: true

- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn:
          text: ${MAESTRO_METRO_URL}
          optional: true
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - tapOn:
          text: "Close"
          optional: true

- openLink: ${MAESTRO_CHAT_URL}
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 90000

- assertVisible:
    id: "chat-screen"

- extendedWaitUntil:
    visible:
      id: "chat-input-field"
    timeout: 30000

- tapOn:
    id: "chat-input-field"
- eraseText

- inputText: "What is two plus two?"

- extendedWaitUntil:
    visible:
      id: "chat-input-send-button"
    timeout: 10000

- tapOn:
    id: "chat-input-send-button"

# Oracle: streaming busy UX (stop) and/or phase while tokens stream
- extendedWaitUntil:
    visible:
      id: "stop-generating-button"
    timeout: 30000

- assertVisible:
    id: "stop-generating-button"

# Phase / token count when still mounted mid-stream
- assertVisible:
    id: "chat-stream-phase"
    optional: true
- assertVisible:
    id: "chat-stream-token-count"
    optional: true

- extendedWaitUntil:
    visible:
      id: "chat-assistant-message"
    timeout: 60000

- assertVisible:
    id: "chat-assistant-message"

- takeScreenshot: S-REACTIVE-01-AC-1-token-streaming

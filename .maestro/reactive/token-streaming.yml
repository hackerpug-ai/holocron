appId: ${MAESTRO_APP_ID}
---
# AC-1 / TC-1 — Token streaming over real SSE (must_observe token growth).
# Seed assistant rows use chat-assistant-message-<id>; this flow asserts the
# LIVE turn only: chat-assistant-message-streaming + token-count thresholds +
# multi-token body words (nonprod deterministic path).

- launchApp:
    clearState: false

- waitForAnimationToEnd
- openLink: ${MAESTRO_DEV_CLIENT_OPEN_URL}
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "DEVELOPMENT SERVERS"
    timeout: 5000
    optional: true

- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn:
          text: ${MAESTRO_METRO_URL}
          optional: true
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - tapOn:
          text: "Close"
          optional: true

- extendedWaitUntil:
    notVisible:
      text: "Downloading"
    timeout: 60000
    optional: true

- openLink: holocron://chat/00000000-0000-4000-8000-0000000000e4
- waitForAnimationToEnd

- runFlow:
    when:
      notVisible:
        id: "chat-screen"
    commands:
      - waitForAnimationToEnd
      - openLink: holocron://chat/00000000-0000-4000-8000-0000000000e4
      - waitForAnimationToEnd

- runFlow:
    when:
      notVisible:
        id: "chat-screen"
    commands:
      - waitForAnimationToEnd
      - openLink: ${MAESTRO_DEV_CLIENT_OPEN_URL}
      - waitForAnimationToEnd
      - openLink: holocron://chat/00000000-0000-4000-8000-0000000000e4
      - waitForAnimationToEnd

- openLink: holocron://chat/00000000-0000-4000-8000-0000000000e4
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 90000

- assertVisible:
    id: "chat-screen"

- extendedWaitUntil:
    visible:
      id: "chat-input-field"
    timeout: 45000

- extendedWaitUntil:
    visible: "Assistant seed reply for E2E Conversation Alpha"
    timeout: 30000
    optional: true

- tapOn:
    id: "chat-input-field"
- eraseText

- inputText: "What is two plus two?"

- extendedWaitUntil:
    visible:
      id: "chat-input-send-button"
    timeout: 10000

- tapOn:
    id: "chat-input-send-button"

# NON-OPTIONAL must_observe: busy latch + token growth + streaming bubble
- extendedWaitUntil:
    visible:
      id: "chat-agent-busy-true"
    timeout: 45000
    optional: true

- extendedWaitUntil:
    visible:
      id: "stop-generating-button"
    timeout: 45000
    optional: true

- extendedWaitUntil:
    visible:
      id: "stop-generating-oracle"
    timeout: 45000
    optional: true

- extendedWaitUntil:
    visible:
      id: "chat-stream-token-count"
    timeout: 60000

- assertVisible:
    id: "chat-stream-token-count"

- extendedWaitUntil:
    visible:
      id: "chat-stream-token-count-at-least-1"
    timeout: 60000

- assertVisible:
    id: "chat-stream-token-count-at-least-1"

# Live turn bubble: streaming while in-flight, latest after complete/cancel
- extendedWaitUntil:
    visible:
      id: "chat-assistant-message-streaming"
    timeout: 30000
    optional: true

- runFlow:
    when:
      notVisible:
        id: "chat-assistant-message-streaming"
    commands:
      - extendedWaitUntil:
          visible:
            id: "chat-assistant-message-latest"
          timeout: 60000
      - assertVisible:
          id: "chat-assistant-message-latest"

- runFlow:
    when:
      visible:
        id: "chat-assistant-message-streaming"
    commands:
      - assertVisible:
          id: "chat-assistant-message-streaming"

# Multi-token body proof: token-count threshold is the mid-stream must_observe
# (Markdown accessibility often does not expose individual words to XCTest).
# Token-count oracles unmount when streamPhase → idle after reconcile.
- extendedWaitUntil:
    visible:
      id: "chat-stream-token-count-at-least-3"
    timeout: 60000
    optional: true

# REDHAT-FIX-01 PATH-A: required oracle — title 'Streaming' seeded by seed:e2e
- extendedWaitUntil:
    visible: "Streaming"
    timeout: 30000

# End-state must_observe: durable NEW-turn bubble with content.
# Do NOT re-assert chat-stream-token-count-at-least-1 after stream ends —
# renderStreamStatus returns null when streamPhase === 'idle' (oracles unmount).
# Mid-stream assert of token-count-at-least-1 (above) already proved growth.
- extendedWaitUntil:
    visible:
      id: "chat-assistant-message-latest"
    timeout: 90000

- assertVisible:
    id: "chat-assistant-message-latest"

- takeScreenshot: S-REACTIVE-01-AC-1-token-streaming

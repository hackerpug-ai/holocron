appId: ${MAESTRO_APP_ID}
---
# AC-2 / TC-2 [PRIMARY] — Mid-stream airplane reconnect, zero dup tokens
# Env: MAESTRO_APP_ID, MAESTRO_DEV_CLIENT_OPEN_URL, MAESTRO_CHAT_URL, MAESTRO_METRO_URL

- launchApp:
    clearState: false

- waitForAnimationToEnd
- openLink: ${MAESTRO_DEV_CLIENT_OPEN_URL}
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "DEVELOPMENT SERVERS"
    timeout: 5000
    optional: true

- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn:
          text: ${MAESTRO_METRO_URL}
          optional: true
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - tapOn:
          text: "Close"
          optional: true

- openLink: ${MAESTRO_CHAT_URL}
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 90000

- assertVisible:
    id: "chat-screen"

- extendedWaitUntil:
    visible:
      id: "chat-input-field"
    timeout: 30000

- tapOn:
    id: "chat-input-field"
- eraseText

- inputText: "Write a detailed multi-sentence answer about the number five with at least eight words."

- extendedWaitUntil:
    visible:
      id: "chat-input-send-button"
    timeout: 10000

- tapOn:
    id: "chat-input-send-button"

- extendedWaitUntil:
    visible:
      id: "stop-generating-button"
    timeout: 30000

- assertVisible:
    id: "stop-generating-button"

- extendedWaitUntil:
    visible:
      id: "chat-assistant-message"
    timeout: 30000

- assertVisible:
    id: "chat-stream-last-seq"

- setAirplaneMode: enabled
- waitForAnimationToEnd:
    timeout: 1000

- extendedWaitUntil:
    visible:
      id: "chat-reconnecting-indicator"
    timeout: 15000
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- setAirplaneMode: disabled

- extendedWaitUntil:
    notVisible:
      id: "chat-reconnecting-indicator"
    timeout: 30000
    optional: true

- extendedWaitUntil:
    notVisible:
      id: "stop-generating-button"
    timeout: 90000

- assertNotVisible:
    id: "stop-generating-button"

- assertVisible:
    id: "chat-assistant-message"

- takeScreenshot: S-REACTIVE-01-AC-2-reconnect-exactly-once

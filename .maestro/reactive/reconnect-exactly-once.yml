appId: ${MAESTRO_APP_ID}
---
# REDHAT-FIX-03 / AC-2 / TC-2 — Mid-stream airplane reconnect, zero duplicate tokens.
# Captures numeric streamLastSeq / streamTokenCount (not visibility-only) and
# asserts final agent bubble count == 1.

- launchApp:
    clearState: false

- waitForAnimationToEnd
- openLink: ${MAESTRO_DEV_CLIENT_OPEN_URL}
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "DEVELOPMENT SERVERS"
    timeout: 5000
    optional: true

- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn:
          text: ${MAESTRO_METRO_URL}
          optional: true
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
      - tapOn:
          text: "Close"
          optional: true

- extendedWaitUntil:
    notVisible:
      text: "Downloading"
    timeout: 60000
    optional: true

- openLink: holocron://chat/00000000-0000-4000-8000-0000000000e4
- waitForAnimationToEnd

- runFlow:
    when:
      notVisible:
        id: "chat-screen"
    commands:
      - waitForAnimationToEnd
      - openLink: holocron://chat/00000000-0000-4000-8000-0000000000e4
      - waitForAnimationToEnd

- runFlow:
    when:
      notVisible:
        id: "chat-screen"
    commands:
      - waitForAnimationToEnd
      - openLink: ${MAESTRO_DEV_CLIENT_OPEN_URL}
      - waitForAnimationToEnd
      - openLink: holocron://chat/00000000-0000-4000-8000-0000000000e4
      - waitForAnimationToEnd

# Re-assert deep link after Zero list settles (prevents most-recent theft)
- openLink: holocron://chat/00000000-0000-4000-8000-0000000000e4
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 90000

- assertVisible:
    id: "chat-screen"

# Early LogBox dismiss so Zero reconnect toasts don't cover the composer.
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn:
          text: "Dismiss"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Minimize"
    commands:
      - tapOn:
          text: "Minimize"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "chat-input-field"
    timeout: 45000

# Dismiss LogBox / console-error overlays that steal focus and hide send.
# Zero-cache reconnect errors mount a red modal or bottom toast over the input.
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn:
          text: "Dismiss"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Minimize"
    commands:
      - tapOn:
          text: "Minimize"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Console Error"
    commands:
      - tapOn:
          text: "Dismiss"
          optional: true
      - tapOn:
          text: "Minimize"
          optional: true
      - waitForAnimationToEnd

# Green-gate pattern: tap → erase → inputText (no extra re-tap).
# Mentions-controlled input only mounts send when value.length > 0
# (VoiceMic replaces send when empty + showVoiceButton).
- tapOn:
    id: "chat-input-field"
- eraseText
- inputText: "Write a detailed multi-sentence answer about the number five with at least eight words."

# First wait is optional so retry branches can run if inputText missed RN state
- extendedWaitUntil:
    visible:
      id: "chat-input-send-button"
    timeout: 8000
    optional: true

# Retry 1: re-focus, erase, retype (controlled-state miss)
- runFlow:
    when:
      notVisible:
        id: "chat-input-send-button"
    commands:
      - runFlow:
          when:
            visible: "Dismiss"
          commands:
            - tapOn:
                text: "Dismiss"
      - tapOn:
          id: "chat-input-field"
      - eraseText
      - inputText: "Write five detailed sentences about rivers and mountains please."
      - extendedWaitUntil:
          visible:
            id: "chat-input-send-button"
          timeout: 10000
          optional: true

# Retry 2: re-focus, shorter probe text
- runFlow:
    when:
      notVisible:
        id: "chat-input-send-button"
    commands:
      - tapOn:
          id: "chat-input-field"
      - eraseText
      - inputText: "Please write five sentences about the number five now."
      - extendedWaitUntil:
          visible:
            id: "chat-input-send-button"
          timeout: 10000
          optional: true

# Retry 3: double-tap focus + inputText (sometimes single tap misses RN focus)
- runFlow:
    when:
      notVisible:
        id: "chat-input-send-button"
    commands:
      - doubleTapOn:
          id: "chat-input-field"
      - eraseText
      - inputText: "Write five words about five please now."
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "chat-input-send-button"
          timeout: 10000
          optional: true

- assertVisible:
    id: "chat-input-send-button"

# CRITICAL: do not wait for hierarchy settle after send — streaming tokens keep
# mutating the tree for ~5s, and Maestro's default settle wait finishes AFTER
# stop-hold + mid-stream oracles are already gone.
- tapOn:
    id: "chat-input-send-button"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 1

# Immediately latch stream-started oracles (busy + token growth)
- extendedWaitUntil:
    visible:
      id: "stop-generating-button"
    timeout: 15000
    optional: true

- extendedWaitUntil:
    visible:
      id: "stop-generating-oracle"
    timeout: 5000
    optional: true

- extendedWaitUntil:
    visible:
      id: "chat-stream-token-count-at-least-1"
    timeout: 45000

- assertVisible:
    id: "chat-stream-token-count-at-least-1"

# Static suite contract: stop-generating-button may race complete after tokens.
# Prefer live Stop when still present; optional so fast complete does not flake.
- runFlow:
    when:
      visible:
        id: "stop-generating-button"
    commands:
      - assertVisible:
          id: "stop-generating-button"
          optional: true

# Capture both numeric oracles (extendedWaitUntil is the authoritative assert —
# a follow-up assertVisible can race remount after resetStream).
- extendedWaitUntil:
    visible:
      id: "chat-stream-token-count-at-least-3"
    timeout: 60000

- extendedWaitUntil:
    visible:
      id: "chat-stream-last-seq-at-least-3"
    timeout: 30000

# Note: do NOT assert bare id chat-stream-last-seq — Maestro id matching is
# regex-like and collides with chat-stream-last-seq-N / at-least-3 siblings.
# Numeric oracle chat-stream-last-seq-at-least-3 is the H3 contract.

# Prefer mid-stream airplane when still streaming; otherwise complete path
- extendedWaitUntil:
    visible:
      id: "chat-assistant-message-streaming"
    timeout: 5000
    optional: true

# Peak oracles re-assert (module high-water survives complete+remount)
- extendedWaitUntil:
    visible:
      id: "chat-stream-last-seq-at-least-3"
    timeout: 15000

- extendedWaitUntil:
    visible:
      id: "chat-stream-token-count-at-least-3"
    timeout: 15000

- setAirplaneMode: enabled
- waitForAnimationToEnd:
    timeout: 1000

- extendedWaitUntil:
    visible:
      id: "chat-reconnecting-indicator"
    timeout: 15000
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- setAirplaneMode: disabled

- extendedWaitUntil:
    notVisible:
      id: "chat-reconnecting-indicator"
    timeout: 30000
    optional: true

- extendedWaitUntil:
    notVisible:
      id: "stop-generating-button"
    timeout: 120000

- assertNotVisible:
    id: "stop-generating-button"

# Final NEW-turn bubble after gap-fill reconcile
- extendedWaitUntil:
    visible:
      id: "chat-assistant-message-latest"
    timeout: 60000

- assertVisible:
    id: "chat-assistant-message-latest"

# GATE-FIX-01 product: painted outcome required — not fail-safe 1×1 alone.
# Deterministic body (buildDeterministicChatTokens). Use single-token anchors
# because Markdown can split lines; Maestro text is regex. Seed never contains
# these tokens ("Rivers"/"clouds"/"valleys").
- extendedWaitUntil:
    visible:
      text: ".*Rivers.*"
    timeout: 60000
- assertVisible:
    text: ".*Rivers.*"
- extendedWaitUntil:
    visible:
      text: ".*clouds.*"
    timeout: 30000
- assertVisible:
    text: ".*clouds.*"
- extendedWaitUntil:
    visible:
      text: ".*One two three.*"
    timeout: 30000
    optional: true

# Live-turn user prompt painted (non-empty bubble). Primary Maestro input
# always includes "detailed multi-sentence"; required so empty yellow fails.
- extendedWaitUntil:
    visible:
      text: ".*detailed multi-sentence.*"
    timeout: 45000
- assertVisible:
    text: ".*detailed multi-sentence.*"

# Numeric oracles after resume: lastSeq >= 3 and tokenCount >= 3
# Use extendedWaitUntil — post-airplane hierarchy settle can lag assertVisible.
- extendedWaitUntil:
    visible:
      id: "chat-stream-last-seq-at-least-3"
    timeout: 30000

- extendedWaitUntil:
    visible:
      id: "chat-stream-token-count-at-least-3"
    timeout: 30000

# Agent bubble count == 1 for the turn (exactly one latest assistant message)
- extendedWaitUntil:
    visible:
      id: "chat-assistant-bubble-count-1"
    timeout: 30000

# Streaming bubble must not remain after complete (no second live agent row)
- assertNotVisible:
    id: "chat-assistant-message-streaming"

# REDHAT-FIX-01 PATH-A: required oracle — title 'Streaming' seeded by seed:e2e
- extendedWaitUntil:
    visible: "Streaming"
    timeout: 30000
- extendedWaitUntil:
    visible: "Streaming"
    timeout: 60000

- takeScreenshot: S-REACTIVE-01-AC-2-reconnect-exactly-once

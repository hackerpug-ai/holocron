appId: ${MAESTRO_APP_ID}
---
# AC-2 / TC-2 [PRIMARY] — Mid-stream airplane-mode reconnect, zero duplicate tokens
# Prerequisite: holo seed:e2e --reset; platform + Zero + fleet healthy.

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      id: "chat-screen"
    timeout: 60000

- tapOn:
    id: "chat-header-menu-button"
    optional: true
- tapOn:
    id: "screen-header-menu-button"
    optional: true
- extendedWaitUntil:
    visible:
      id: "conversation-row"
    timeout: 15000
    optional: true
- tapOn:
    id: "conversation-row"
    index: 0
    optional: true

- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 15000

- tapOn:
    id: "chat-input-field"
    optional: true
- tapOn:
    id: "chat-input"
    optional: true

- inputText: "Write a detailed multi-sentence answer about the number five with at least eight words."

- tapOn:
    id: "chat-input-send-button"

# Wait for 2-3 tokens / streaming UI
- extendedWaitUntil:
    visible:
      id: "stop-generating-button"
    timeout: 20000

- extendedWaitUntil:
    visible:
      id: "chat-assistant-message"
    timeout: 30000

- extendedWaitUntil:
    visible:
      id: "streaming-cursor"
    timeout: 20000
    optional: true

# Airplane mode ON 3s then OFF — resume via Last-Event-ID
- setAirplaneMode: enabled
- waitForAnimationToEnd:
    timeout: 1000
- extendedWaitUntil:
    visible:
      id: "chat-reconnecting-indicator"
    timeout: 10000
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- setAirplaneMode: disabled

# Stream resumes and completes without duplicate bubbles
- extendedWaitUntil:
    notVisible:
      id: "chat-reconnecting-indicator"
    timeout: 30000
    optional: true

- extendedWaitUntil:
    notVisible:
      id: "stop-generating-button"
    timeout: 90000
    optional: true

- assertVisible:
    id: "chat-assistant-message"

# Exactly one final assistant bubble for the reply (no FourFour duplicates)
- assertVisible:
    id: "chat-assistant-message"
    index: 0

- takeScreenshot: S-REACTIVE-01-AC-2-reconnect-exactly-once
